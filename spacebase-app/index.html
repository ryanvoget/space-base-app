<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a0e1a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Space Base">
  <meta name="description" content="Pass-and-play Space Base board game">

  <!-- iOS home screen icons (generate these from your icon) -->
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <link rel="manifest" href="manifest.json">
  <title>Space Base</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    :root {
      --bg: #0a0e1a;
      --surface: #131929;
      --surface2: #1c2438;
      --border: rgba(255,255,255,0.1);
      --border2: rgba(255,255,255,0.2);
      --text: #e8eaf0;
      --text2: #8a93a8;
      --blue: #3a8fd4;
      --blue-bg: rgba(58,143,212,0.15);
      --gold: #c9933a;
      --gold-bg: rgba(201,147,58,0.15);
      --green: #4a9e6a;
      --green-bg: rgba(74,158,106,0.15);
      --purple: #7a5fc9;
      --purple-bg: rgba(122,95,201,0.15);
      --radius: 10px;
      --radius-sm: 6px;
    }

    html, body { height: 100%; overflow: hidden; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 15px;
    }

    #app {
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Screens */
    .screen { display: none; flex-direction: column; height: 100%; overflow: hidden; }
    .screen.active { display: flex; }

    /* Scrollable content area */
    .scroll-area {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 12px;
    }

    /* Typography */
    h1 { font-size: 22px; font-weight: 600; }
    h2 { font-size: 16px; font-weight: 600; margin-bottom: 8px; }
    p  { font-size: 13px; color: var(--text2); line-height: 1.5; }

    /* Cards / surfaces */
    .card {
      background: var(--surface);
      border: 0.5px solid var(--border);
      border-radius: var(--radius);
      padding: 12px;
      margin-bottom: 10px;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 500;
      border: 0.5px solid var(--border2);
      border-radius: var(--radius-sm);
      background: transparent;
      color: var(--text);
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      -webkit-user-select: none;
      user-select: none;
    }
    .btn:active { transform: scale(0.97); }
    .btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
    .btn.primary:active { background: #2a7abf; }
    .btn.block { width: 100%; }
    .btn.sm { padding: 6px 12px; font-size: 13px; }
    .btn:disabled { opacity: 0.35; pointer-events: none; }

    /* Badges */
    .badge {
      display: inline-block;
      padding: 3px 9px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
    }
    .badge.blue   { background: var(--blue-bg);   color: var(--blue);   }
    .badge.gold   { background: var(--gold-bg);   color: var(--gold);   }
    .badge.green  { background: var(--green-bg);  color: var(--green);  }
    .badge.purple { background: var(--purple-bg); color: var(--purple); }

    /* Stat row */
    .stat-row { display: flex; gap: 8px; margin-bottom: 10px; }
    .stat-box {
      flex: 1;
      background: var(--surface2);
      border-radius: var(--radius-sm);
      padding: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }
    .stat-box .label { font-size: 10px; color: var(--text2); text-transform: uppercase; letter-spacing: 0.5px; }
    .stat-box .value { font-size: 22px; font-weight: 600; line-height: 1; }

    /* Player tabs */
    #player-tabs {
      display: flex;
      gap: 6px;
      padding: 10px 12px 0;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    #player-tabs::-webkit-scrollbar { display: none; }
    .player-tab {
      flex-shrink: 0;
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 500;
      border-radius: 20px;
      border: 0.5px solid var(--border);
      background: transparent;
      color: var(--text2);
      cursor: pointer;
      white-space: nowrap;
    }
    .player-tab.active { background: var(--blue); border-color: var(--blue); color: #fff; }

    /* Banner */
    #active-player-banner {
      padding: 8px 12px;
      background: var(--surface);
      border-bottom: 0.5px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Sector grid */
    .sectors-grid {
      display: flex;
      flex-direction: row;
      gap: 5px;
      margin: 6px 0;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: 4px;
    }
    .sectors-grid::-webkit-scrollbar { display: none; }
    .sector {
      border: 0.5px solid var(--border);
      border-radius: 9px;
      padding: 16px 6px 12px;
      text-align: center;
      background: var(--surface2);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      height: 252px;
      min-width: 175px;
      max-width: 175px;
      flex-shrink: 0;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      position: relative;
    }
    .sector.highlighted {
      border: 1.5px solid var(--blue);
      background: var(--blue-bg);
      box-shadow: 0 0 8px rgba(58,143,212,0.4);
    }
    .sector .sec-num {
      font-size: 14px;
      font-weight: 700;
      color: var(--text2);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      position: absolute;
      top: 10px;
      left: 12px;
    }
    .sector .sec-reward {
      font-size: 18px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.5;
    }
    .sector .sec-deployed {
      font-size: 15px;
      color: var(--blue);
      border-top: 0.5px solid var(--border);
      width: 100%;
      padding-top: 8px;
      line-height: 1.5;
    }

    /* Dice */
    .dice-display { display: flex; gap: 10px; align-items: center; justify-content: center; margin: 10px 0; }
    .die {
      width: 52px; height: 52px;
      border: 1.5px solid var(--border2);
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 28px; font-weight: 700;
      background: var(--surface2);
    }

    /* Shipyard cards */
    .shipyard-card {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px;
      background: var(--surface2);
      border: 0.5px solid var(--border);
      border-radius: var(--radius-sm);
      margin-bottom: 6px;
    }
    .sc-info { flex: 1; min-width: 0; }
    .sc-name { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sc-detail { font-size: 11px; color: var(--text2); margin-top: 1px; }
    .sc-cost { font-size: 14px; font-weight: 600; color: var(--gold); min-width: 30px; text-align: center; }

    /* Log */
    .log {
      background: var(--surface2);
      border-radius: var(--radius-sm);
      padding: 8px 10px;
      margin-top: 8px;
    }
    .log-entry { font-size: 11px; color: var(--text2); padding: 2px 0; border-bottom: 0.5px solid var(--border); }
    .log-entry:last-child { border-bottom: none; }

    /* Setup screen */
    #setup-screen .scroll-area { padding-top: 40px; }
    .setup-header { text-align: center; margin-bottom: 28px; }
    .setup-header .icon { font-size: 52px; margin-bottom: 10px; }

    /* Name inputs */
    .name-input {
      width: 100%;
      padding: 10px 12px;
      background: var(--surface2);
      border: 0.5px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-size: 14px;
      outline: none;
    }
    .name-input:focus { border-color: var(--blue); }

    select {
      padding: 8px 12px;
      background: var(--surface2);
      border: 0.5px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-size: 14px;
      outline: none;
    }

    /* End screen */
    .winner-banner { text-align: center; padding: 32px 20px 20px; }
    .winner-banner .trophy { font-size: 64px; margin-bottom: 12px; }

    .flex-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .divider { border: none; border-top: 0.5px solid var(--border); margin: 8px 0; }

    /* Safe area padding for notch phones */
    .safe-bottom { padding-bottom: env(safe-area-inset-bottom, 0px); }
  </style>
</head>
<body>
<div id="app">

  <!-- SETUP SCREEN -->
  <div id="setup-screen" class="screen active">
    <div class="scroll-area safe-bottom">
      <div class="setup-header">
        <div class="icon">🚀</div>
        <h1>Space Base</h1>
        <p style="margin-top: 4px;">Pass-and-play · 2–5 commanders</p>
      </div>

      <div class="card">
        <h2>Number of players</h2>
        <select id="num-players" onchange="initSetup()">
          <option value="2">2 players</option>
          <option value="3" selected>3 players</option>
          <option value="4">4 players</option>
          <option value="5">5 players</option>
        </select>
      </div>

      <div class="card">
        <h2>Player names</h2>
        <div id="player-names-container"></div>
      </div>

      <button class="btn primary block" onclick="startGame()" style="padding: 14px;">Launch Game</button>
    </div>
  </div>

  <!-- CARD REVEAL SCREEN -->
  <div id="reveal-screen" class="screen">
    <div class="scroll-area safe-bottom" style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80vh;gap:16px;padding:24px;">
      <div id="reveal-content"></div>
    </div>
  </div>

  <!-- GAME SCREEN -->
  <div id="game-screen" class="screen">
    <div id="active-player-banner"></div>
    <div style="display:flex;align-items:center;justify-content:space-between;padding:6px 8px;background:var(--surface);border-bottom:0.5px solid var(--border);flex-shrink:0;">
      <div id="viewer-label" style="font-size:13px;font-weight:500;color:var(--text);flex:1;"></div>
      <button id="music-btn" onclick="toggleMusic()" style="background:none;border:none;font-size:18px;cursor:pointer;padding:4px;" title="Toggle music">🔇</button>
    </div>
    <button onclick="shiftViewer(-1)" style="position:fixed;left:0;top:50%;transform:translateY(-50%);z-index:100;background:var(--surface2);border:0.5px solid var(--border);border-radius:0 8px 8px 0;color:var(--text);font-size:22px;cursor:pointer;padding:16px 10px;line-height:1;">&#8592;</button>
    <button onclick="shiftViewer(1)" style="position:fixed;right:0;top:50%;transform:translateY(-50%);z-index:100;background:var(--surface2);border:0.5px solid var(--border);border-radius:8px 0 0 8px;color:var(--text);font-size:22px;cursor:pointer;padding:16px 10px;line-height:1;">&#8594;</button>
    <div class="scroll-area safe-bottom" id="main-content" style="padding-left:44px;padding-right:44px;"></div>
  </div>

  <!-- END SCREEN -->
  <div id="end-screen" class="screen">
    <div class="scroll-area safe-bottom">
      <div class="winner-banner">
        <div class="trophy">🏆</div>
        <h1 id="winner-title"></h1>
        <p id="winner-subtitle" style="margin-top: 6px;"></p>
      </div>
      <div class="card" id="final-scores"></div>
      <button class="btn primary block" onclick="resetGame()" style="margin-top: 10px; padding: 14px;">Play Again</button>
    </div>
  </div>

</div>

// ─── STATE ───────────────────────────────────────────────────────────────────
let G = {};

function shuffle(arr) {
  let a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ─── SETUP ───────────────────────────────────────────────────────────────────
function initSetup() {
  const n = parseInt(document.getElementById('num-players').value);
  const c = document.getElementById('player-names-container');
  c.innerHTML = '';
  for (let i = 0; i < n; i++) {
    const d = document.createElement('div');
    d.style.marginBottom = '8px';
    d.innerHTML = `
      <label style="font-size:12px;color:var(--text2);display:block;margin-bottom:4px;">Player ${i+1}</label>
      <input class="name-input" type="text" id="pname-${i}" value="Commander ${i+1}" autocomplete="off">`;
    c.appendChild(d);
  }
}

function startGame() {
  const n = parseInt(document.getElementById('num-players').value);
  const names = Array.from({length:n}, (_,i) => document.getElementById(`pname-${i}`).value || `Commander ${i+1}`);

  const l1deck = shuffle(SHIP_CARDS.filter(c => c.level===1));
  const l2deck = shuffle(SHIP_CARDS.filter(c => c.level===2));
  const l3deck = shuffle(SHIP_CARDS.filter(c => c.level===3));

  const players = names.map(name => {
    const sectors = {};
    for (let s=1; s<=12; s++) {
      const sc = STARTING_CARDS.find(c => c.sector===s);
      sectors[s] = { stationed:{...sc, level:0}, deployed:[] };
    }
    return { name, credits:5, income:0, vp:0, sectors };
  });

  // Draw a starting card for each player but don't apply yet
  const drawnCards = players.map(() => l1deck.shift());

  G = {
    players,
    drawnCards,
    revealIdx: 0,
    currentPlayer: 0, startPlayer: 0,
    phase: 'roll', dice: [0,0], viewingPlayer: 0,
    shipyard: {
      l1: l1deck.splice(0,6), l2: l2deck.splice(0,6), l3: l3deck.splice(0,6),
      l1deck, l2deck, l3deck
    },
    log: [],
    endTriggered: false, chosenDiceMode: null,
  };

  show('reveal-screen');
  renderReveal();
}

function renderReveal() {
  const i = G.revealIdx;
  const player = G.players[i];
  const card = G.drawnCards[i];
  const oldCard = STARTING_CARDS.find(c => c.sector === card.sector);
  const el = document.getElementById('reveal-content');
  el.innerHTML =
    '<div style="text-align:center;width:100%;">'
    + '<div style="font-size:13px;color:var(--text2);margin-bottom:4px;">Player ' + (i+1) + ' of ' + G.players.length + '</div>'
    + '<div style="font-size:20px;font-weight:600;margin-bottom:16px;">' + player.name + '</div>'
    + '<div style="font-size:13px;color:var(--text2);margin-bottom:12px;">Your starting ship card:</div>'
    + '<div style="background:var(--surface);border:1px solid var(--blue);border-radius:14px;padding:20px;max-width:260px;margin:0 auto 20px;box-shadow:0 4px 16px rgba(58,143,212,0.2);">'
    + '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;"><span style="font-size:11px;font-weight:700;color:var(--blue);letter-spacing:0.5px;text-transform:uppercase;">Level 1</span><span style="font-size:11px;font-weight:700;color:var(--text2);">S' + card.sector + '</span></div>'
    + '<div style="font-size:18px;font-weight:600;color:var(--text);margin-bottom:16px;">' + card.name + '</div>'
    + '<div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;">'
    + '<div style="background:var(--surface2);border-radius:8px;padding:10px 14px;text-align:center;">'
    + '<div style="font-size:10px;color:var(--text2);margin-bottom:4px;">ACTIVE (stationed)</div>'
    + '<div>' + rewardIcons(card.station) + '</div>'
    + '</div>'
    + '<div style="background:var(--surface2);border-radius:8px;padding:10px 14px;text-align:center;">'
    + '<div style="font-size:10px;color:var(--text2);margin-bottom:4px;">PASSIVE (deployed)</div>'
    + '<div>' + rewardIcons(card.deployed) + '</div>'
    + '</div>'
    + '</div>'
    + '<div style="margin-top:14px;font-size:11px;color:var(--text2);">Replaces sector ' + card.sector + ' starting card (' + rewardStr(oldCard.station) + ')</div>'
    + '<div style="margin-top:4px;font-size:11px;color:var(--text2);">Cost: <b style="color:var(--gold);">' + card.cost + 'C</b> deducted from your starting 5C</div>'
    + '</div>'
    + '<button class="btn primary block" onclick="confirmStartCard()" style="padding:14px;font-size:15px;max-width:260px;margin:0 auto;">Confirm Starting Card</button>'
    + '</div>';
}

function confirmStartCard() {
  const i = G.revealIdx;
  const p = G.players[i];
  const card = G.drawnCards[i];

  p.sectors[card.sector].deployed.push({...p.sectors[card.sector].stationed});
  p.sectors[card.sector].stationed = {...card};
  p.credits = Math.max(0, p.credits - card.cost);
  p._startSector = card.sector;

  G.revealIdx++;
  if (G.revealIdx < G.players.length) {
    renderReveal();
    return;
  }

  // All cards confirmed — finalize game start
  let startPlayerIdx = 0, highestSector = -1;
  G.players.forEach((p, i) => {
    if (p._startSector > highestSector) { highestSector = p._startSector; startPlayerIdx = i; }
  });

  const n = G.players.length;
  G.players.forEach((p, i) => {
    if (i === startPlayerIdx) return;
    const offset = (i - startPlayerIdx + n) % n;
    if (offset===1) p.credits += 1;
    else if (offset===2) p.credits += 2;
    else if (offset===3) p.income += 1;
    else if (offset===4) p.income += 1;
  });

  G.currentPlayer = startPlayerIdx;
  G.startPlayer = startPlayerIdx;
  G.viewingPlayer = startPlayerIdx;
  G.log = [`Game started! ${G.players[startPlayerIdx].name} goes first.`];

  show('game-screen');
  renderGame();
}

// ─── GAME LOGIC ──────────────────────────────────────────────────────────────
function rewardStr(r) {
  if (!r) return '—';
  const p = [];
  if (r.credits)  p.push(r.credits + 'C');
  if (r.income)   p.push('+' + r.income + ' Inc');
  if (r.vp)       p.push(r.vp + ' VP');
  if (r.arrow === 'both')  p.push('←→');
  if (r.arrow === 'left')  p.push('←');
  if (r.arrow === 'right') p.push('→');
  if (r.special)  p.push(r.special);
  if (r.chargeMax) p.push('[' + Array(r.chargeMax).fill('□').join('') + ']');
  return p.join(' ') || '—';
}

function rewardIcons(r, size=12) {
  if (!r) return '';
  const fs = Math.round(size * 0.92);
  const coinSvg = (n) => `<span style="display:inline-flex;align-items:center;gap:2px;white-space:nowrap;">

    <span style="font-size:${fs}px;font-weight:600;color:#c9933a;">${n}</span></span>`;
  const incomeSvg = (n) => `<span style="display:inline-flex;align-items:center;gap:2px;white-space:nowrap;">
    <svg width="${size}" height="${size}" viewBox="0 0 32 32"><polygon points="16,2 28,9 28,23 16,30 4,23 4,9" fill="#3B6D11" opacity="0.3"/><polygon points="16,6 23,10 23,22 16,26 9,22 9,10" fill="#3B6D11"/><polyline points="16,22 16,12" stroke="#C0DD97" stroke-width="2.5" stroke-linecap="round"/><polyline points="12,16 16,12 20,16" stroke="#C0DD97" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
    <span style="font-size:${fs}px;font-weight:600;color:#4a9e6a;">+${n}</span></span>`;
  const vpSvg = (n) => `<span style="display:inline-flex;align-items:center;gap:2px;white-space:nowrap;">
    <svg width="${size}" height="${size}" viewBox="0 0 32 32"><path d="M16 3 C16 3 22 8 22 17 L19 20 L13 20 L10 17 C10 8 16 3 16 3Z" fill="#7F77DD"/><circle cx="16" cy="17" r="3" fill="#534AB7"/><path d="M10 17 L7 22 L11 20Z" fill="#534AB7" opacity="0.7"/><path d="M22 17 L25 22 L21 20Z" fill="#534AB7" opacity="0.7"/><path d="M13 22 L14 27 L16 24 L18 27 L19 22Z" fill="#7F77DD" opacity="0.8"/></svg>
    <span style="font-size:${fs}px;font-weight:600;color:#7a5fc9;">${n}</span></span>`;
  const parts = [];
  if (r.credits) parts.push(coinSvg(r.credits));
  if (r.income)  parts.push(incomeSvg(r.income));
  if (r.vp)      parts.push(vpSvg(r.vp));
  if (r.arrow === 'both')  parts.push(`<span style="font-size:${fs}px;font-weight:700;color:#3a8fd4;">←→</span>`);
  if (r.arrow === 'left')  parts.push(`<span style="font-size:${fs}px;font-weight:700;color:#3a8fd4;">←</span>`);
  if (r.arrow === 'right') parts.push(`<span style="font-size:${fs}px;font-weight:700;color:#3a8fd4;">→</span>`);
  if (r.special) parts.push(`<span style="font-size:${Math.max(9,fs-1)}px;color:#c9a43a;font-style:italic;line-height:1.2;">${r.special}</span>`);
  if (r.chargeMax) {
    const cubes = Array(r.chargeMax).fill('<span style="display:inline-block;width:' + Math.round(fs*1.1) + 'px;height:' + Math.round(fs*1.1) + 'px;border:1.5px solid #888;border-radius:2px;background:transparent;vertical-align:middle;margin:0 1px;"></span>').join('');
    parts.push(`<span style="display:inline-flex;align-items:center;gap:1px;white-space:nowrap;">${cubes}</span>`);
  }
  return parts.join('<span style="font-size:9px;color:var(--text2);margin:0 1px;"> </span>') || '—';
}

function applyReward(player, reward) {
  if (!reward) return;
  if (reward.credits) player.credits = Math.min(20, player.credits + reward.credits);
  if (reward.income)  player.income  = Math.min(10, player.income  + reward.income);
  if (reward.vp)      player.vp      = Math.min(60, player.vp      + reward.vp);
}

function rollDice() {
  G.dice = [Math.ceil(Math.random()*6), Math.ceil(Math.random()*6)];
  G.phase = 'choose-dice';
  addLog(`${G.players[G.currentPlayer].name} rolled ${G.dice[0]} + ${G.dice[1]} = ${G.dice[0]+G.dice[1]}`);
  renderGame();
}

function chooseDiceMode(mode) {
  G.chosenDiceMode = mode;
  const [d1,d2] = G.dice;
  const sectors = mode==='split' ? (d1===d2 ? [d1] : [d1,d2]) : [d1+d2];
  const cp = G.players[G.currentPlayer];

  sectors.forEach(s => applyReward(cp, cp.sectors[s].stationed.station));
  addLog(`${cp.name} activated sector(s) ${sectors.join(' & ')}`);

  G.players.forEach((op,i) => {
    if (i===G.currentPlayer) return;
    sectors.forEach(s => op.sectors[s].deployed.forEach(d => applyReward(op, d.deployed)));
  });

  G.phase = 'buy';
  renderGame();
}

function buyCard(cardId) {
  const cp = G.players[G.currentPlayer];
  let card=null, lvl=null;
  for (const l of [1,2,3]) {
    const f = G.shipyard[`l${l}`].find(c => c.id===cardId);
    if (f) { card=f; lvl=l; break; }
  }
  if (!card || cp.credits < card.cost) return;

  cp.sectors[card.sector].deployed.push({...cp.sectors[card.sector].stationed});
  cp.sectors[card.sector].stationed = {...card};
  cp.credits = 0;

  const idx = G.shipyard[`l${lvl}`].findIndex(c => c.id===cardId);
  G.shipyard[`l${lvl}`].splice(idx,1);
  const refill = G.shipyard[`l${lvl}deck`].shift();
  if (refill) G.shipyard[`l${lvl}`].push(refill);

  addLog(`${cp.name} bought ${card.name} (S${card.sector}) for ${card.cost}C`);
  endTurn();
}

function skipBuy() {
  addLog(`${G.players[G.currentPlayer].name} skipped buying`);
  endTurn();
}

function endTurn() {
  const p = G.players[G.currentPlayer];
  if (p.credits < p.income) p.credits = p.income;

  if (!G.endTriggered) {
    G.players.forEach(pl => {
      if (pl.vp >= 40 && !G.endTriggered) {
        G.endTriggered = true;
        addLog(`${pl.name} reached 40 VP! Finishing the round...`);
      }
    });
  }

  const rightOfStart = (G.startPlayer - 1 + G.players.length) % G.players.length;
  if (G.endTriggered && G.currentPlayer === rightOfStart) { endGame(); return; }

  G.currentPlayer = (G.currentPlayer + 1) % G.players.length;
  G.phase = 'roll';
  G.dice = [0,0];
  G.chosenDiceMode = null;
  G.viewingPlayer = G.currentPlayer;
  renderGame();
}

function endGame() {
  show('end-screen');
  const sorted = [...G.players].sort((a,b) => b.vp - a.vp);
  document.getElementById('winner-title').textContent = `${sorted[0].name} wins!`;
  document.getElementById('winner-subtitle').textContent = `${sorted[0].vp} VP — Admiral of the Fleet!`;
  document.getElementById('final-scores').innerHTML = '<h2>Final Scores</h2>' +
    sorted.map((p,i) => `<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:0.5px solid var(--border);">
      <span>${i+1}. ${p.name}</span><span class="badge purple">${p.vp} VP</span></div>`).join('');
}

function addLog(msg) { G.log.unshift(msg); if (G.log.length > 20) G.log.pop(); }
function resetGame() { show('setup-screen'); initSetup(); }
function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// ─── RENDER ──────────────────────────────────────────────────────────────────
function renderGame() { renderTabs(); renderBanner(); renderMain(); }

function shiftViewer(dir) {
  G.viewingPlayer = (G.viewingPlayer + dir + G.players.length) % G.players.length;
  renderGame();
}

function renderTabs() {
  const vp = G.players[G.viewingPlayer];
  const isActive = G.viewingPlayer === G.currentPlayer;
  const label = document.getElementById('viewer-label');
  if (label) {
    label.innerHTML = vp.name + (isActive ? ' <span style="font-size:10px;background:var(--blue);color:#fff;border-radius:10px;padding:1px 6px;vertical-align:middle;">Your turn</span>' : '');
  }
}

function renderBanner() {
  const p = G.players[G.currentPlayer];
  const labels = {roll:'Roll dice','choose-dice':'Allocate dice',buy:'Buy a ship'};
  const isCurrent = G.viewingPlayer === G.currentPlayer;
  document.getElementById('active-player-banner').innerHTML =
    `<div><div style="font-size:11px;color:var(--text2);">Active player</div>
     <div style="font-size:15px;font-weight:600;">${p.name}</div></div>
     <span class="badge ${isCurrent?'blue':'gold'}">${labels[G.phase]||G.phase}</span>`;
}

function renderMain() {
  const vp = G.players[G.viewingPlayer];
  const cp = G.players[G.currentPlayer];
  const isCurrent = G.viewingPlayer === G.currentPlayer;
  const [d1,d2] = G.dice;
  const total = d1+d2;

  let html = '';

  if (isCurrent) {
    if (G.phase === 'roll') {
      html += `<button class="btn primary block" onclick="rollDice()" style="padding:16px;font-size:16px;margin-bottom:10px;">🎲 Roll Dice</button>`;
    }

    if (G.phase === 'choose-dice') {
      html += `<div class="card">
        <div class="dice-display">
          <div class="die">${d1}</div>
          <span style="color:var(--text2);">+</span>
          <div class="die">${d2}</div>
          <span style="color:var(--text2);font-size:14px;">= ${total}</span>
        </div>
        <p style="margin-bottom:10px;">Activate two sectors individually, or one sector equal to the total.</p>
        <div class="flex-row">
          <button class="btn primary sm" onclick="chooseDiceMode('split')">Sectors ${d1} &amp; ${d2}</button>
          <button class="btn sm" onclick="chooseDiceMode('total')">Sector ${total}</button>
        </div>
      </div>`;
    }

    if (G.phase === 'buy') {
      html += `<div style="display:flex;gap:6px;align-items:center;margin-bottom:8px;">
        <div class="die" style="width:36px;height:36px;font-size:18px;">${d1}</div>
        <div class="die" style="width:36px;height:36px;font-size:18px;">${d2}</div>
        <span style="font-size:12px;color:var(--text2);">= ${total} · ${G.chosenDiceMode==='split'?`S${d1}&S${d2}`:`S${total}`}</span>
      </div>
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
          <h2 style="margin:0;">Shipyard</h2>
          <span style="font-size:12px;color:var(--text2);">You have <b style="color:var(--gold);">${cp.credits}C</b></span>
        </div>`;

      html += `<button class="btn sm block" onclick="skipBuy()" style="margin-top:6px;">Skip purchase</button></div>`;
    }
  } else {
    html += `<p style="margin-bottom:8px;">Viewing ${vp.name}'s board · ${cp.name}'s turn</p>`;
  }

  // Sector grid
  const highlighted = [];
  if (G.phase==='buy' && G.chosenDiceMode) {
    if (G.chosenDiceMode==='split') { highlighted.push(d1); if(d1!==d2) highlighted.push(d2); }
    else highlighted.push(total);
  }

  // Centered shipyard
  const ranges = ['2–5C','6–9C','12–14C'];
  const lvlColors = ['#1a3a5c','#1a3d1a','#2d1a4a'];
  const lvlBorders = ['#2a5a8c','#2a5d2a','#4d2a7a'];
  html += '<div class="card" style="margin-top:8px;text-align:center;"><h2 style="text-align:center;">Shipyard</h2>';
  [1,2,3].forEach(function(lvl) {
    const cards = G.shipyard['l' + lvl];
    if (!cards.length) return;
    const canBuyAny = isCurrent && G.phase === 'buy';
    html += '<div style="font-size:10px;font-weight:600;color:var(--text2);margin:8px 0 4px;text-transform:uppercase;letter-spacing:0.6px;text-align:center;">Level ' + lvl + ' · ' + ranges[lvl-1] + '</div>';
    html += '<div style="display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:6px;justify-content:center;">';
    cards.forEach(function(card) {
      const canBuy = canBuyAny && cp.credits >= card.cost;
      const showBtn = canBuyAny;
      const buyBtn = showBtn ? '<button class="btn sm ' + (canBuy ? 'primary' : '') + '" ' + (canBuy ? '' : 'disabled') + ' onclick="buyCard(\'' + card.id + '\')" style="padding:3px 8px;font-size:11px;">Buy</button>' : '';
      html += '<div style="min-width:90px;max-width:90px;flex-shrink:0;background:' + lvlColors[lvl-1] + ';border:0.5px solid ' + lvlBorders[lvl-1] + ';border-radius:8px;padding:8px 6px;display:flex;flex-direction:column;gap:4px;box-shadow:0 2px 6px rgba(0,0,0,0.3);">'
        + '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:2px;">'
        + '<span style="font-size:10px;font-weight:700;color:var(--gold);">' + card.cost + 'C</span>'
        + '<span style="font-size:9px;font-weight:700;color:var(--text2);">S' + card.sector + '</span>'
        + '</div>'
        + '<div style="font-size:11px;font-weight:600;color:var(--text);line-height:1.2;">' + card.name + '</div>'
        + '<div style="display:flex;flex-direction:column;gap:2px;margin-top:2px;">'
        + '<div style="font-size:9px;color:var(--text2);">Active</div>'
        + '<div>' + rewardIcons(card.station) + '</div>'
        + '<div style="font-size:9px;color:var(--text2);margin-top:2px;">Passive</div>'
        + '<div>' + rewardIcons(card.deployed) + '</div>'
        + '</div>'
        + '<div style="margin-top:4px;">'
        + buyBtn
        + '</div></div>';
    });
    html += '</div>';
  });
  html += '</div>';

  // Sectors (3/4 right) + Stats panel (1/4 left) side by side
  html += '<div class="card" style="margin-top:8px;">';
  html += '<h2>' + (isCurrent ? 'Your' : vp.name + "'s") + ' Sectors</h2>';
  html += '<div style="display:flex;gap:8px;align-items:flex-start;">';

  // Left 1/4: compact stats
  html += '<div style="flex:0 0 68px;display:flex;flex-direction:column;gap:6px;padding-top:2px;height:252px;">';
  html += '<div style="background:var(--surface2);border-radius:8px;padding:7px 4px;text-align:center;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;">'
    + '<svg width="20" height="20" viewBox="0 0 32 32"><circle cx="16" cy="16" r="13" fill="#BA7517" opacity="0.2"/><circle cx="16" cy="16" r="10" fill="#BA7517" opacity="0.5"/><circle cx="16" cy="16" r="7" fill="#BA7517"/><text x="16" y="20" text-anchor="middle" font-size="9" font-weight="700" fill="#FAEEDA" font-family="sans-serif">C</text></svg>'
    + '<div style="font-size:15px;font-weight:700;color:var(--gold);line-height:1.1;">' + vp.credits + '</div>'
    + '<div style="font-size:8px;color:var(--text2);text-transform:uppercase;letter-spacing:0.3px;">Credits</div>'
    + '</div>';
  html += '<div style="background:var(--surface2);border-radius:8px;padding:7px 4px;text-align:center;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;">'
    + '<svg width="20" height="20" viewBox="0 0 32 32"><polygon points="16,2 28,9 28,23 16,30 4,23 4,9" fill="#3B6D11" opacity="0.25"/><polygon points="16,6 23,10 23,22 16,26 9,22 9,10" fill="#3B6D11"/><polyline points="16,22 16,12" stroke="#C0DD97" stroke-width="2.5" stroke-linecap="round"/><polyline points="12,16 16,12 20,16" stroke="#C0DD97" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>'
    + '<div style="font-size:15px;font-weight:700;color:var(--green);line-height:1.1;">' + vp.income + '</div>'
    + '<div style="font-size:8px;color:var(--text2);text-transform:uppercase;letter-spacing:0.3px;">Income</div>'
    + '</div>';
  html += '<div style="background:var(--surface2);border-radius:8px;padding:7px 4px;text-align:center;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;">'
    + '<svg width="20" height="20" viewBox="0 0 32 32"><path d="M16 2 C16 2 24 8 24 18 L20 22 L12 22 L8 18 C8 8 16 2 16 2Z" fill="#7F77DD"/><circle cx="16" cy="17" r="4" fill="#534AB7"/><circle cx="16" cy="17" r="2" fill="#EEEDFE"/><path d="M8 18 L4 25 L11 22Z" fill="#534AB7" opacity="0.8"/><path d="M24 18 L28 25 L21 22Z" fill="#534AB7" opacity="0.8"/><path d="M12 22 L13 30 L16 26 L19 30 L20 22Z" fill="#7F77DD" opacity="0.9"/></svg>'
    + '<div style="font-size:15px;font-weight:700;color:var(--purple);line-height:1.1;">' + vp.vp + '<span style="font-size:8px;font-weight:400;color:var(--text2);">/40</span></div>'
    + '<div style="font-size:8px;color:var(--text2);text-transform:uppercase;letter-spacing:0.3px;">VP</div>'
    + '</div>';
  html += '</div>';

  // Right 3/4: scrollable sector row
  html += '<div style="flex:1;overflow:hidden;">';
  html += '<div class="sectors-grid" style="justify-content:center;">';
  for (let s=1; s<=12; s++) {
    const sec = vp.sectors[s];
    const isHL = highlighted.includes(s);
    const depIconRs = sec.deployed.map(d => rewardIcons(d.deployed, 20)).filter(r => r);
    html += '<div class="sector ' + (isHL ? 'highlighted' : '') + '" title="S' + s + ': ' + sec.stationed.name + '">'
      + '<div class="sec-num">S' + s + '</div>'
      + '<div class="sec-reward">' + rewardIcons(sec.stationed.station, 20) + '</div>'
      + (depIconRs.length ? '<div class="sec-deployed">' + depIconRs.join(' ') + '</div>' : '')
      + '</div>';
  }
  html += '</div></div>';
  html += '</div></div>';

  // Activity feed at the very bottom
  if (G.log.length) {
    html += '<div class="log" style="margin-top:8px;">' + G.log.slice(0,6).map(function(l){ return '<div class="log-entry">' + l + '</div>'; }).join('') + '</div>';
  }

  document.getElementById('main-content').innerHTML = html;
}

// ─── AUDIO ───────────────────────────────────────────────────────────────────
const bgAudio = new Audio('./3.mp3');
bgAudio.loop = true;
bgAudio.volume = 0.4;
let musicPlaying = false;

function toggleMusic() {
  const btn = document.getElementById('music-btn');
  if (musicPlaying) {
    bgAudio.pause();
    musicPlaying = false;
    if (btn) btn.textContent = '🔇';
  } else {
    bgAudio.play().then(() => {
      musicPlaying = true;
      if (btn) btn.textContent = '🔊';
    }).catch(() => {});
  }
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
initSetup();

// Register service worker for offline support
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
</script>
