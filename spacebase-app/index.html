<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a0e1a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Space Base">
  <meta name="description" content="Pass-and-play Space Base board game">

  <!-- iOS home screen icons (generate these from your icon) -->
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <link rel="manifest" href="manifest.json">
  <title>Space Base</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    :root {
      --bg: #0a0e1a;
      --surface: #131929;
      --surface2: #1c2438;
      --border: rgba(255,255,255,0.1);
      --border2: rgba(255,255,255,0.2);
      --text: #e8eaf0;
      --text2: #8a93a8;
      --blue: #3a8fd4;
      --blue-bg: rgba(58,143,212,0.15);
      --gold: #c9933a;
      --gold-bg: rgba(201,147,58,0.15);
      --green: #4a9e6a;
      --green-bg: rgba(74,158,106,0.15);
      --purple: #7a5fc9;
      --purple-bg: rgba(122,95,201,0.15);
      --radius: 10px;
      --radius-sm: 6px;
    }

    html, body { height: 100%; overflow: hidden; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 15px;
    }

    #app {
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Screens */
    .screen { display: none; flex-direction: column; height: 100%; overflow: hidden; }
    .screen.active { display: flex; }

    /* Scrollable content area */
    .scroll-area {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 12px;
    }

    /* Typography */
    h1 { font-size: 22px; font-weight: 600; }
    h2 { font-size: 16px; font-weight: 600; margin-bottom: 8px; }
    p  { font-size: 13px; color: var(--text2); line-height: 1.5; }

    /* Cards / surfaces */
    .card {
      background: var(--surface);
      border: 0.5px solid var(--border);
      border-radius: var(--radius);
      padding: 12px;
      margin-bottom: 10px;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 500;
      border: 0.5px solid var(--border2);
      border-radius: var(--radius-sm);
      background: transparent;
      color: var(--text);
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      -webkit-user-select: none;
      user-select: none;
    }
    .btn:active { transform: scale(0.97); }
    .btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
    .btn.primary:active { background: #2a7abf; }
    .btn.block { width: 100%; }
    .btn.sm { padding: 6px 12px; font-size: 13px; }
    .btn:disabled { opacity: 0.35; pointer-events: none; }

    /* Badges */
    .badge {
      display: inline-block;
      padding: 3px 9px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
    }
    .badge.blue   { background: var(--blue-bg);   color: var(--blue);   }
    .badge.gold   { background: var(--gold-bg);   color: var(--gold);   }
    .badge.green  { background: var(--green-bg);  color: var(--green);  }
    .badge.purple { background: var(--purple-bg); color: var(--purple); }

    /* Stat row */
    .stat-row { display: flex; gap: 8px; margin-bottom: 10px; }
    .stat-box {
      flex: 1;
      background: var(--surface2);
      border-radius: var(--radius-sm);
      padding: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }
    .stat-box .label { font-size: 10px; color: var(--text2); text-transform: uppercase; letter-spacing: 0.5px; }
    .stat-box .value { font-size: 22px; font-weight: 600; line-height: 1; }

    /* Player tabs */
    #player-tabs {
      display: flex;
      gap: 6px;
      padding: 10px 12px 0;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    #player-tabs::-webkit-scrollbar { display: none; }
    .player-tab {
      flex-shrink: 0;
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 500;
      border-radius: 20px;
      border: 0.5px solid var(--border);
      background: transparent;
      color: var(--text2);
      cursor: pointer;
      white-space: nowrap;
    }
    .player-tab.active { background: var(--blue); border-color: var(--blue); color: #fff; }

    /* Banner */
    #active-player-banner {
      padding: 8px 12px;
      background: var(--surface);
      border-bottom: 0.5px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Sector grid */
    .sectors-grid {
      display: flex;
      flex-direction: row;
      gap: 5px;
      align-items: flex-end;
      margin: 6px 0;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: 4px;
    }
    .sectors-grid::-webkit-scrollbar { display: none; }
    .sector-wrapper {
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      min-width: 175px;
      max-width: 175px;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: 0 3px 10px rgba(0,0,0,0.5);
    }
    .sector-wrapper.highlighted {
      border: 2px solid var(--blue);
      box-shadow: 0 0 12px rgba(58,143,212,0.5);
    }
    .sector {
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 252px;
      flex-shrink: 0;
    }
    .sector .sec-art {
      flex: 1;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 8px;
    }
    .sector .sec-stars {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: radial-gradient(circle,rgba(255,255,255,0.8) 1px,transparent 1px);
      background-size: 14px 14px;
      opacity: 0.15;
      pointer-events: none;
    }
    .sector .sec-cost {
      position: absolute;
      top: 8px; left: 8px;
      width: 28px; height: 28px;
      border-radius: 50%;
      background: #c9933a;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 800; color: #fff;
      box-shadow: 0 1px 4px rgba(0,0,0,0.5);
    }
    .sector .sec-num {
      position: absolute;
      top: 8px; right: 8px;
      width: 28px; height: 28px;
      border-radius: 50%;
      background: #555;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 800; color: #ddd;
      box-shadow: 0 1px 4px rgba(0,0,0,0.5);
    }
    .sector .sec-ship-icon {
      text-align: center;
      font-size: 36px;
      margin-bottom: 4px;
    }
    .sector .sec-namebar {
      padding: 4px 6px;
      text-align: center;
      margin: 0 -8px -8px;
    }
    .sector .sec-namebar .sec-name {
      font-size: 10px; font-weight: 700; color: #e0e0e0;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .sector .sec-namebar .sec-type {
      font-size: 8px; color: #8899bb;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .sector .sec-station {
      background: #1a3a5c;
      padding: 6px 8px;
      display: flex; align-items: center; justify-content: center; flex-wrap: wrap;
      gap: 4px; height: 90px; overflow: hidden;
      border-top: 1px solid rgba(255,255,255,0.08);
      flex-shrink: 0;
    }
    .sec-passive-row {
      background: #5c1a1a;
      padding: 5px 8px;
      display: flex; align-items: center; justify-content: center; flex-wrap: wrap;
      gap: 4px; height: 50px; overflow: hidden;
      border-top: 1px solid rgba(255,255,255,0.08);
      flex-shrink: 0;
    }

    /* Dice */
    .dice-display { display: flex; gap: 10px; align-items: center; justify-content: center; margin: 10px 0; }
    .die {
      width: 52px; height: 52px;
      border: 1.5px solid var(--border2);
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 28px; font-weight: 700;
      background: var(--surface2);
    }

    /* Shipyard cards */
    .shipyard-card {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px;
      background: var(--surface2);
      border: 0.5px solid var(--border);
      border-radius: var(--radius-sm);
      margin-bottom: 6px;
    }
    .sc-info { flex: 1; min-width: 0; }
    .sc-name { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sc-detail { font-size: 11px; color: var(--text2); margin-top: 1px; }
    .sc-cost { font-size: 14px; font-weight: 600; color: var(--gold); min-width: 30px; text-align: center; }

    /* Log */
    .log {
      background: var(--surface2);
      border-radius: var(--radius-sm);
      padding: 8px 10px;
      margin-top: 8px;
    }
    .log-entry { font-size: 11px; color: var(--text2); padding: 2px 0; border-bottom: 0.5px solid var(--border); }
    .log-entry:last-child { border-bottom: none; }

    /* Setup screen */
    #setup-screen .scroll-area { padding-top: 40px; }
    .setup-header { text-align: center; margin-bottom: 28px; }
    .setup-header .icon { font-size: 52px; margin-bottom: 10px; }

    /* Name inputs */
    .name-input {
      width: 100%;
      padding: 10px 12px;
      background: var(--surface2);
      border: 0.5px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-size: 14px;
      outline: none;
    }
    .name-input:focus { border-color: var(--blue); }

    select {
      padding: 8px 12px;
      background: var(--surface2);
      border: 0.5px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-size: 14px;
      outline: none;
    }

    /* End screen */
    .winner-banner { text-align: center; padding: 32px 20px 20px; }
    .winner-banner .trophy { font-size: 64px; margin-bottom: 12px; }

    .flex-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .divider { border: none; border-top: 0.5px solid var(--border); margin: 8px 0; }

    /* Safe area padding for notch phones */
    .safe-bottom { padding-bottom: env(safe-area-inset-bottom, 0px); }

    /* ─── RESPONSIVE MOBILE LAYOUT ──────────────────────────────── */

    /* Portrait mobile: 6 shop cards per row, sectors wrap to 2 rows of 6 */
    @media (orientation: portrait) and (max-width: 600px) {
      /* Roll dice button and dice result: scale to 2/3 */
      .dice-zone { zoom: 0.667; }

      /* Shop: zoom cards to 41% — 6 × 36.9px + 5 × 3px gap ≈ 236px fits any phone */
      .shop-row {
        flex-wrap: wrap !important;
        overflow-x: hidden !important;
        gap: 3px !important;
        justify-content: center !important;
      }
      .shop-card {
        flex: 0 0 auto !important;
        flex-shrink: 0 !important;
        min-width: 90px !important;
        max-width: 90px !important;
        zoom: 0.41 !important;
      }

      /* Sectors: move stats above, wrap grid to 2 rows of 6 */
      .sectors-outer {
        flex-direction: column !important;
        align-items: stretch !important;
      }
      .sector-stats-panel {
        flex: none !important;
        width: 100% !important;
        height: auto !important;
        flex-direction: row !important;
        padding-top: 0 !important;
        gap: 4px !important;
        zoom: 0.5 !important;
      }
      .sector-stats-panel > div {
        height: 50px !important;
        min-height: 0 !important;
        flex: 1 !important;
      }
      .sectors-container {
        flex: none !important;
        width: 100% !important;
        overflow: visible !important;
      }
      .sectors-grid {
        flex-wrap: wrap !important;
        overflow-x: visible !important;
        gap: 3px !important;
        justify-content: flex-start !important;
      }
      /* Zoom sectors to 21% — 6 × 36.75px + 5 × 3px gap ≈ 236px fits any phone */
      .sector-wrapper {
        flex: 0 0 auto !important;
        flex-shrink: 0 !important;
        min-width: 175px !important;
        max-width: 175px !important;
        zoom: 0.21 !important;
      }
    }

    /* Landscape mobile: same shop zoom, 12 sectors in one row */
    @media (orientation: landscape) and (max-height: 500px) {
      .shop-row {
        flex-wrap: wrap !important;
        overflow-x: hidden !important;
        gap: 3px !important;
        justify-content: center !important;
      }
      .shop-card {
        flex: 0 0 auto !important;
        flex-shrink: 0 !important;
        min-width: 90px !important;
        max-width: 90px !important;
        zoom: 0.41 !important;
      }
      /* Zoom sectors to 19% — 12 × 33.25px + 11 × 3px gap ≈ 432px fits landscape */
      .sectors-grid {
        overflow-x: hidden !important;
        gap: 3px !important;
        flex-wrap: nowrap !important;
      }
      .sector-wrapper {
        flex: 0 0 auto !important;
        flex-shrink: 0 !important;
        min-width: 175px !important;
        max-width: 175px !important;
        zoom: 0.19 !important;
      }
    }
  </style>
  <style id="mz"></style>
</head>
<body>
<div id="app">

  <!-- SETUP SCREEN -->
  <div id="setup-screen" class="screen active">
    <div class="scroll-area safe-bottom">
      <div class="setup-header">
        <div class="icon">🚀</div>
        <h1>Space Base</h1>
        <p style="margin-top: 4px;">Solo vs AI · 2–5 players</p>
      </div>

      <div class="card">
        <h2>Number of opponents</h2>
        <select id="num-players" onchange="initSetup()">
          <option value="2">1 opponent (2 total)</option>
          <option value="3" selected>2 opponents (3 total)</option>
          <option value="4">3 opponents (4 total)</option>
          <option value="5">4 opponents (5 total)</option>
        </select>
      </div>

      <div class="card">
        <h2>Your name</h2>
        <div id="player-names-container"></div>
      </div>

      <button class="btn primary block" onclick="startGame()" style="padding: 14px;">Launch Game</button>
    </div>
  </div>

  <!-- CARD REVEAL SCREEN -->
  <div id="reveal-screen" class="screen">
    <div class="scroll-area safe-bottom" style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80vh;gap:16px;padding:24px;">
      <div id="reveal-content"></div>
    </div>
  </div>

  <!-- GAME SCREEN -->
  <div id="game-screen" class="screen">
    <div id="active-player-banner"></div>
    <div style="display:flex;align-items:center;justify-content:space-between;padding:6px 8px;background:var(--surface);border-bottom:0.5px solid var(--border);flex-shrink:0;">
      <div id="viewer-label" style="font-size:13px;font-weight:500;color:var(--text);flex:1;"></div>
      <button id="music-btn" onclick="toggleMusic()" style="background:none;border:none;font-size:18px;cursor:pointer;padding:4px;" title="Toggle music">🔇</button>
    </div>
    <button onclick="shiftViewer(-1)" style="position:fixed;left:0;top:50%;transform:translateY(-50%);z-index:100;background:var(--surface2);border:0.5px solid var(--border);border-radius:0 8px 8px 0;color:var(--text);font-size:22px;cursor:pointer;padding:16px 10px;line-height:1;">&#8592;</button>
    <button onclick="shiftViewer(1)" style="position:fixed;right:0;top:50%;transform:translateY(-50%);z-index:100;background:var(--surface2);border:0.5px solid var(--border);border-radius:8px 0 0 8px;color:var(--text);font-size:22px;cursor:pointer;padding:16px 10px;line-height:1;">&#8594;</button>
    <div class="scroll-area safe-bottom" id="main-content" style="padding-left:44px;padding-right:44px;"></div>
  </div>

  <!-- END SCREEN -->
  <div id="end-screen" class="screen">
    <div class="scroll-area safe-bottom">
      <div class="winner-banner">
        <div class="trophy">🏆</div>
        <h1 id="winner-title"></h1>
        <p id="winner-subtitle" style="margin-top: 6px;"></p>
      </div>
      <div class="card" id="final-scores"></div>
      <button class="btn primary block" onclick="resetGame()" style="margin-top: 10px; padding: 14px;">Play Again</button>
    </div>
  </div>

</div>

  { sector:10, cost:36, vp:12 },
  { sector:11, cost:39, vp:13 },
  { sector:12, cost:42, vp:14 },
];

const STARTING_CARDS = [
  { sector:1,  name:'Colony Ship',      station:{credits:1},  deployed:{credits:1} },
  { sector:2,  name:'Patrol Craft',     station:{credits:1},  deployed:{credits:1} },
  { sector:3,  name:'Cargo Ship',       station:{credits:1},  deployed:{credits:1} },
  { sector:4,  name:'Mining Vessel',    station:{credits:1},  deployed:{credits:1} },
  { sector:5,  name:'Science Vessel',   station:{credits:1},  deployed:{credits:1} },
  { sector:6,  name:'Exploration Ship', station:{credits:1},  deployed:{credits:1} },
  { sector:7,  name:'Defense Frigate',  station:{credits:3},  deployed:{credits:2} },
  { sector:8,  name:'Heavy Cruiser',    station:{credits:3},  deployed:{credits:3} },
  { sector:9,  name:'Fleet Tender',     station:{income:1},   deployed:{credits:3} },
  { sector:10, name:'Command Ship',     station:{income:1},   deployed:{credits:3} },
  { sector:11, name:'Assault Carrier',  station:{income:1},   deployed:{credits:4} },
  { sector:12, name:'Dreadnaught',      station:{income:1},   deployed:{credits:5} },
];

// ─── STATE ───────────────────────────────────────────────────────────────────
let G = {};

function shuffle(arr) {
  let a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ─── SETUP ───────────────────────────────────────────────────────────────────
function initSetup() {
  const c = document.getElementById('player-names-container');
  c.innerHTML = '';
  const d = document.createElement('div');
  d.innerHTML = `<label style="font-size:12px;color:var(--text2);display:block;margin-bottom:4px;">Your name</label>
    <input class="name-input" type="text" id="pname-0" value="Commander" autocomplete="off">`;
  c.appendChild(d);
}

function startGame() {
  const n = parseInt(document.getElementById('num-players').value);
  const humanName = document.getElementById('pname-0').value || 'Commander';
  const names = [humanName, ...Array.from({length:n-1}, (_,i) => 'CPU ' + (i+1))];

  const l1deck = shuffle(SHIP_CARDS.filter(c => c.level===1));
  const l2deck = shuffle(SHIP_CARDS.filter(c => c.level===2));
  const l3deck = shuffle(SHIP_CARDS.filter(c => c.level===3));

  const players = names.map(name => {
    const sectors = {};
    for (let s=1; s<=12; s++) {
      const sc = STARTING_CARDS.find(c => c.sector===s);
      sectors[s] = { stationed:{...sc, level:0}, deployed:[] };
    }
    return { name, credits:5, income:0, vp:0, sectors };
  });

  // Draw a starting card for each player but don't apply yet
  const drawnCards = players.map(() => l1deck.shift());

  G = {
    players,
    drawnCards,
    revealIdx: 0,
    currentPlayer: 0, startPlayer: 0,
    phase: 'roll', dice: [0,0], viewingPlayer: 0,
    shipyard: {
      l1: l1deck.splice(0,6), l2: l2deck.splice(0,6), l3: l3deck.splice(0,6),
      l1deck, l2deck, l3deck
    },
    log: [],
    endTriggered: false, chosenDiceMode: null,
    pendingArrows: [], pendingAbility: null, pendingClaim: null,
    extraBuys: 0, extraBuyFilter: null,
    nextRollBonus: 0, nextRollTotal: null, rollBonus: 0, rollTotal: null,
  };

  show('reveal-screen');
  renderReveal();
}

function renderReveal() {
  const i = G.revealIdx;
  const player = G.players[i];
  const card = G.drawnCards[i];
  const oldCard = STARTING_CARDS.find(c => c.sector === card.sector);
  const el = document.getElementById('reveal-content');

  // Build card matching shop card format, scaled up for reveal screen
  const revealStaBg = card.station && isGreenAbility(card.station.special || '') ? '#1a3a1a' : '#1a3a5c';
  const revealDepBg = card.deployed && isGreenAbility(card.deployed.special || '') ? '#1a3a1a' : '#5c1a1a';
  const cardHtml =
    '<div style="width:150px;border-radius:12px;overflow:hidden;box-shadow:0 6px 20px rgba(0,0,0,0.6);border:1px solid rgba(255,255,255,0.15);display:flex;flex-direction:column;margin:0 auto 16px;">'
    // Art area
    + '<div style="background:linear-gradient(160deg,#0a1628 0%,#1a2a5c 50%,#0d1f3c 100%);padding:10px 10px 6px;position:relative;min-height:100px;display:flex;flex-direction:column;justify-content:flex-end;">'
    + '<div style="position:absolute;top:0;left:0;right:0;bottom:0;background-image:radial-gradient(circle,rgba(255,255,255,0.8) 1px,transparent 1px);background-size:14px 14px;opacity:0.15;pointer-events:none;"></div>'
    // Cost circle top-left
    + '<div style="position:absolute;top:8px;left:8px;width:28px;height:28px;border-radius:50%;background:#c9933a;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#fff;box-shadow:0 1px 4px rgba(0,0,0,0.5);">' + card.cost + '</div>'
    // Sector circle top-right
    + '<div style="position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;background:#555;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#ddd;box-shadow:0 1px 4px rgba(0,0,0,0.5);">' + card.sector + '</div>'
    // Ship emoji
    + '<div style="text-align:center;font-size:36px;margin-bottom:4px;">🚀</div>'
    // Name bar
    + '<div style="background:#0a1a3a;margin:0 -10px -6px;padding:4px 8px;text-align:center;">'
    + '<div style="font-size:9px;font-weight:700;color:#e0e0e0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + card.name + '</div>'
    + '<div style="font-size:8px;color:#8899bb;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + (card.type||'') + '</div>'
    + '</div>'
    + '</div>'
    // Station reward — blue/green, fixed height like shop
    + '<div style="background:' + revealStaBg + ';padding:8px 10px;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:3px;min-height:60px;border-top:1px solid rgba(255,255,255,0.08);">'
    + rewardIcons(card.station, shopActiveIconSize(card.station))
    + '</div>'
    // Deployed reward — red/green, upside down like shop
    + '<div style="background:' + revealDepBg + ';padding:5px 8px;display:flex;align-items:center;justify-content:center;min-height:38px;border-top:1px solid rgba(255,255,255,0.08);">'
    + '<div style="transform:rotate(180deg);display:flex;align-items:center;justify-content:center;flex-wrap:nowrap;gap:3px;width:100%;">'
    + rewardIcons(card.deployed, shopPassiveIconSize(card.deployed))
    + '</div></div>'
    + '</div>';

  const isAIReveal = i > 0;
  el.innerHTML =
    '<div style="text-align:center;width:100%;padding:0 16px;">'
    + '<div style="font-size:12px;color:var(--text2);margin-bottom:4px;">' + (isAIReveal ? 'CPU Opponent ' + i : 'You') + ' · ' + (i+1) + ' of ' + G.players.length + '</div>'
    + '<div style="font-size:20px;font-weight:600;margin-bottom:16px;">' + player.name + '</div>'
    + '<div style="font-size:12px;color:var(--text2);margin-bottom:12px;">' + (isAIReveal ? player.name + '\'s starting ship:' : 'Your starting ship:') + '</div>'
    + cardHtml
    + '<div style="font-size:11px;color:var(--text2);margin-bottom:6px;">Replaces S' + card.sector + ' starting card · Costs <b style="color:var(--gold);">' + card.cost + 'C</b></div>'
    + (isAIReveal ? '<div style="font-size:13px;color:var(--text2);font-style:italic;padding:10px 0;">Auto-confirming...</div>' : '<button class="btn primary block" onclick="confirmStartCard()" style="padding:14px;font-size:15px;">Confirm Starting Card</button>')
    + '</div>';

  if (isAIReveal) setTimeout(confirmStartCard, 1200);
}

function confirmStartCard() {
  const i = G.revealIdx;
  const p = G.players[i];
  const card = G.drawnCards[i];

  p.sectors[card.sector].deployed.push({...p.sectors[card.sector].stationed});
  p.sectors[card.sector].stationed = {...card, chargeCount: 0};
  p.credits = Math.max(0, p.credits - card.cost);
  p._startSector = card.sector;

  G.revealIdx++;
  if (G.revealIdx < G.players.length) {
    renderReveal();
    return;
  }

  // All cards confirmed — finalize game start
  let startPlayerIdx = 0, highestSector = -1;
  G.players.forEach((p, i) => {
    if (p._startSector > highestSector) { highestSector = p._startSector; startPlayerIdx = i; }
  });

  const n = G.players.length;
  G.players.forEach((p, i) => {
    if (i === startPlayerIdx) return;
    const offset = (i - startPlayerIdx + n) % n;
    if (offset===1) p.credits += 1;
    else if (offset===2) p.credits += 2;
    else if (offset===3) p.income += 1;
    else if (offset===4) p.income += 1;
  });

  G.currentPlayer = startPlayerIdx;
  G.startPlayer = startPlayerIdx;
  G.viewingPlayer = 0;
  G.colonyPurchased = {};  // sector -> playerName
  G.shopView = 'ships';   // 'ships' or 'colony'
  G.log = [`Game started! ${G.players[startPlayerIdx].name} goes first.`];

  show('game-screen');
  renderGame();
}

// ─── GAME LOGIC ──────────────────────────────────────────────────────────────
function rewardItemCount(r) {
  if (!r) return 0;
  return [r.credits, r.income, r.vp, r.arrow, r.special, r.chargeMax].filter(Boolean).length;
}
function shopPassiveIconSize(r) {
  if (!r) return 12;
  const n = rewardItemCount(r);
  const sl = r.special ? r.special.length : 0;
  if (sl > 14) return 7;
  if (sl > 8)  return 8;
  if (n <= 1)  return 12;
  if (n === 2) return 11;
  if (n === 3) return 9;
  return 8;
}
function shopActiveIconSize(r) {
  if (!r) return 13;
  const n = rewardItemCount(r);
  const sl = r.special ? r.special.length : 0;
  const extraCharge = Math.max(0, (r.chargeMax || 0) - 1);
  const effectiveN = n + extraCharge;
  if (effectiveN >= 5) return 9;
  if (sl > 14) return 10;
  if (sl > 8 || effectiveN >= 4) return 11;
  if (n === 3) return 12;
  if (n <= 1)  return 14;
  return 13;
}
function boardActiveIconSize(r) {
  if (!r) return 26;
  const n = rewardItemCount(r);
  const sl = r.special ? r.special.length : 0;
  const extraCharge = Math.max(0, (r.chargeMax || 0) - 1);
  const effectiveN = n + extraCharge;
  if (effectiveN >= 5) return 17;
  if (sl > 14) return 19;
  if (sl > 8 || effectiveN >= 4) return 21;
  if (n === 3) return 23;
  if (n <= 1)  return 27;
  return 25;
}
function boardPassiveIconSize(r) {
  if (!r) return 22;
  const n = rewardItemCount(r);
  const sl = r.special ? r.special.length : 0;
  if (sl > 14) return 14;
  if (sl > 8)  return 15;
  if (n <= 1)  return 22;
  if (n === 2) return 20;
  if (n === 3) return 17;
  return 15;
}
function rewardStr(r) {
  if (!r) return '—';
  const p = [];
  if (r.credits)  p.push(r.credits + 'C');
  if (r.income)   p.push('+' + r.income + ' Inc');
  if (r.vp)       p.push(r.vp + ' VP');
  if (r.arrow === 'both')  p.push('←→');
  if (r.arrow === 'left')  p.push('←');
  if (r.arrow === 'right') p.push('→');
  if (r.special)  p.push(r.special);
  if (r.chargeMax) p.push('[' + Array(r.chargeMax).fill('□').join('') + ']');
  return p.join(' ') || '—';
}

function rewardIcons(r, size=12, chargeCount=0) {
  if (!r) return '';
  const fs = Math.round(size * 0.92);
  const coinSvg = (n) => `<span style="display:inline-flex;align-items:center;justify-content:center;width:${size*1.8}px;height:${size*1.8}px;border-radius:50%;background:#c9933a;font-size:${fs}px;font-weight:800;color:#fff;box-shadow:0 1px 4px rgba(0,0,0,0.5);flex-shrink:0;">${n}</span>`;
  const incomeSvg = (n) => `<span style="display:inline-flex;align-items:center;justify-content:center;position:relative;flex-shrink:0;">
    <svg width="${size*1.8}" height="${size*1.8}" viewBox="0 0 32 32"><polygon points="16,2 28,9 28,23 16,30 4,23 4,9" fill="#3B6D11"/></svg>
    <span style="position:absolute;font-size:${fs}px;font-weight:800;color:#C0DD97;">${n}</span>
    </span>`;
  const vpSvg = (n) => `<span style="display:inline-flex;align-items:center;justify-content:center;position:relative;flex-shrink:0;">
    <svg width="${size*1.8}" height="${size*1.8}" viewBox="0 0 32 32"><path d="M16 2 C16 2 24 8 24 18 L20 22 L12 22 L8 18 C8 8 16 2 16 2Z" fill="#7F77DD"/><circle cx="16" cy="17" r="4" fill="#534AB7"/><path d="M8 18 L4 25 L11 22Z" fill="#534AB7" opacity="0.8"/><path d="M24 18 L28 25 L21 22Z" fill="#534AB7" opacity="0.8"/><path d="M12 22 L13 30 L16 26 L19 30 L20 22Z" fill="#7F77DD" opacity="0.9"/></svg>
    <span style="position:absolute;font-size:${fs}px;font-weight:800;color:#fff;">${n}</span>
    </span>`;
  const parts = [];
  if (r.credits) parts.push(coinSvg(r.credits));
  if (r.income)  parts.push(incomeSvg(r.income));
  if (r.vp)      parts.push(vpSvg(r.vp));
  if (r.arrow === 'both')  parts.push(`<span style="font-size:${Math.round(size*1.7)}px;font-weight:700;color:#3a8fd4;line-height:1;">←→</span>`);
  if (r.arrow === 'left')  parts.push(`<span style="font-size:${Math.round(size*1.7)}px;font-weight:700;color:#3a8fd4;line-height:1;">←</span>`);
  if (r.arrow === 'right') parts.push(`<span style="font-size:${Math.round(size*1.7)}px;font-weight:700;color:#3a8fd4;line-height:1;">→</span>`);
  if (r.special) {
    const specColor = isGreenAbility(r.special) ? 'var(--green)' : '#c9a43a';
    parts.push(`<span style="font-size:${Math.max(6,fs-1)}px;color:${specColor};font-style:italic;line-height:1.2;text-align:center;word-break:break-word;">${r.special}</span>`);
  }
  if (r.chargeMax) {
    const count = chargeCount;
    const cw = Math.round(fs*1.1);
    const cubes = Array(r.chargeMax).fill(null).map((_, i) => {
      const filled = i < count;
      const bg = filled ? '#f0c040' : 'transparent';
      const bc = filled ? '#c9a434' : '#888';
      return `<span style="display:inline-block;width:${cw}px;height:${cw}px;border:1.5px solid ${bc};border-radius:2px;background:${bg};vertical-align:middle;margin:0 1px;"></span>`;
    }).join('');
    parts.push(`<span style="display:inline-flex;align-items:center;gap:1px;white-space:nowrap;">${cubes}</span>`);
  }
  return parts.join('<span style="font-size:9px;color:var(--text2);margin:0 1px;"> </span>') || '—';
}

function applyReward(player, reward) {
  if (!reward) return;
  if (reward.credits) player.credits = Math.min(20, player.credits + reward.credits);
  if (reward.income)  player.income  = Math.min(10, player.income  + reward.income);
  if (reward.vp)      player.vp      = Math.min(60, player.vp      + reward.vp);
}

function rollDice() {
  const sd = G.setDice || [null, null];
  G.dice = [
    sd[0] !== null ? sd[0] : Math.ceil(Math.random()*6),
    sd[1] !== null ? sd[1] : Math.ceil(Math.random()*6)
  ];
  G.setDice = null;
  G.rollBonus = G.nextRollBonus || 0;
  G.rollTotal = G.nextRollTotal !== undefined ? G.nextRollTotal : null;
  G.nextRollBonus = 0;
  G.nextRollTotal = null;
  G.phase = shouldOfferGreenBonus() ? 'post-roll-bonus' : 'choose-dice';
  const base = G.dice[0] + G.dice[1];
  const eff = G.rollTotal !== null ? G.rollTotal : base + G.rollBonus;
  const bonusNote = G.rollTotal !== null ? ' (forced total: ' + eff + ')' : G.rollBonus > 0 ? ' (+' + G.rollBonus + ' bonus = ' + eff + ')' : '';
  addLog(`${G.players[G.currentPlayer].name} rolled ${G.dice[0]} + ${G.dice[1]} = ${base}${bonusNote}`);
  renderGame();
}

function chooseDiceMode(mode) {
  G.chosenDiceMode = mode;
  const [d1,d2] = G.dice;
  const effTotal = G.rollTotal !== null ? G.rollTotal : (d1 + d2 + (G.rollBonus || 0));
  const sectors = mode==='split' ? [d1, d2] : [effTotal];
  G.rollBonus = 0; G.rollTotal = null;
  const cp = G.players[G.currentPlayer];
  const pendingArrows = [];
  const pendingClaimQueue = [];

  // Collect and log active player rewards
  let cpGains = [];
  sectors.forEach(s => {
    const staCard = cp.sectors[s].stationed;
    const r = staCard.station;
    applyReward(cp, r);
    if (r && r.chargeMax) {
      staCard.chargeCount = Math.min(r.chargeMax, (staCard.chargeCount || 0) + 1);
    }
    if (r && r.arrow) pendingArrows.push({pi: G.currentPlayer, sector: s, arrow: r.arrow, side: 'station'});
    if (r && r.special && !r.chargeMax && /Claim/i.test(r.special)) {
      pendingClaimQueue.push(...parseClaimQueue(r.special));
    }
    const summary = rewardSummary(r);
    if (summary) cpGains.push('S' + s + ': ' + summary);
  });
  addLog(cp.name + ' activated S' + sectors.join('&') + (cpGains.length ? ' — ' + cpGains.join(', ') : ''));

  // Collect and log other players' deployed rewards
  // During an AI turn, skip player 0 — they will choose their own passive sectors
  const isAiTurn = G.currentPlayer !== 0;
  G.players.forEach((op,i) => {
    if (i===G.currentPlayer) return;
    if (isAiTurn && i === 0) return;
    let opGains = [];
    sectors.forEach(s => {
      op.sectors[s].deployed.forEach(d => {
        const depR = d.deployed;
        applyReward(op, depR);
        if (depR && depR.chargeMax) {
          d.chargeCount = Math.min(depR.chargeMax, (d.chargeCount || 0) + 1);
        }
        if (depR && depR.arrow) {
          const vt = getValidArrowTargets(i, s, depR.arrow, 'deployed');
          if (vt.length > 0) pendingArrows.push({pi: i, sector: s, arrow: depR.arrow, side: 'deployed'});
        }
        const summary = rewardSummary(depR);
        if (summary) opGains.push('S' + s + ': ' + summary);
      });
    });
    if (opGains.length) addLog(op.name + ' (passive) — ' + opGains.join(', '));
  });

  G.pendingArrows = pendingArrows;

  if (pendingClaimQueue.length > 0) {
    if (!isAiTurn) {
      G.pendingClaim = {queue: pendingClaimQueue, pi: G.currentPlayer, afterPhase: pendingArrows.length ? 'arrow-choice' : 'buy'};
      G.phase = 'claim';
      renderGame(); return;
    } else {
      pendingClaimQueue.forEach(function(lvl) { autoClaimCard(G.currentPlayer, lvl); });
    }
  }

  if (isAiTurn) {
    const p0 = G.players[0];
    const splitHas = [d1, d2].some(s => s >= 1 && s <= 12 && p0.sectors[s].deployed.length > 0);
    const totalHas = effTotal >= 1 && effTotal <= 12 && p0.sectors[effTotal].deployed.length > 0;
    if (splitHas || totalHas) {
      G.passiveChoiceDice = [d1, d2, effTotal];
      G.phase = 'passive-choice';
    } else {
      G.passiveChoiceDice = null;
      G.phase = pendingArrows.length ? 'arrow-choice' : 'buy';
    }
  } else {
    G.phase = pendingArrows.length ? 'arrow-choice' : 'buy';
  }
  renderGame();
}

function choosePassiveMode(mode) {
  const [pcd1, pcd2, pcTotal] = G.passiveChoiceDice;
  const p0sec = G.players[0].sectors;
  const sectors = mode === 'split'
    ? [pcd1, pcd2].filter(s => s >= 1 && s <= 12 && p0sec[s].deployed.length > 0)
    : [pcTotal];
  const p0 = G.players[0];
  let p0Gains = [];
  sectors.forEach(function(s) {
    if (s < 1 || s > 12) return;
    p0.sectors[s].deployed.forEach(function(d) {
      const depR = d.deployed;
      applyReward(p0, depR);
      if (depR && depR.chargeMax) {
        d.chargeCount = Math.min(depR.chargeMax, (d.chargeCount || 0) + 1);
      }
      if (depR && depR.arrow) {
        const vt = getValidArrowTargets(0, s, depR.arrow, 'deployed');
        if (vt.length > 0) G.pendingArrows.push({pi: 0, sector: s, arrow: depR.arrow, side: 'deployed'});
      }
      const summary = rewardSummary(depR);
      if (summary) p0Gains.push('S' + s + ': ' + summary);
    });
  });
  if (p0Gains.length) addLog(p0.name + ' (passive) — ' + p0Gains.join(', '));
  G.passiveChoiceDice = null;
  G.phase = G.pendingArrows.length ? 'arrow-choice' : 'buy';
  renderGame();
}

function buyCard(cardId) {
  const cp = G.players[G.currentPlayer];
  let card=null, lvl=null;
  for (const l of [1,2,3]) {
    const f = G.shipyard[`l${l}`].find(c => c.id===cardId);
    if (f) { card=f; lvl=l; break; }
  }
  const onExtraBuyRound = (G.extraBuys || 0) === 0 && G.extraBuyFilter;
  if (onExtraBuyRound && (card.sector < G.extraBuyFilter.min || card.sector > G.extraBuyFilter.max)) return;
  if (!card || cp.credits < card.cost || cp.sectors[card.sector].colonyLocked) return;

  cp.sectors[card.sector].deployed.push({...cp.sectors[card.sector].stationed});
  cp.sectors[card.sector].stationed = {...card, chargeCount: 0};
  cp.credits = 0;

  const idx = G.shipyard[`l${lvl}`].findIndex(c => c.id===cardId);
  G.shipyard[`l${lvl}`].splice(idx,1);
  const refill = G.shipyard[`l${lvl}deck`].shift();
  if (refill) G.shipyard[`l${lvl}`].push(refill);

  addLog(`${cp.name} bought ${card.name} (S${card.sector}) for ${card.cost}C`);
  if (G.extraBuys > 0) {
    G.extraBuys--;
    if (G.extraBuys === 0) G.extraBuyFilter = null;
    renderGame();
  } else {
    G.extraBuyFilter = null;
    if (G.currentPlayer === 0) { G.phase = 'pass'; renderGame(); } else { endTurn(); }
  }
}

function skipBuy() {
  if ((G.extraBuys || 0) > 0) {
    addLog(`${G.players[G.currentPlayer].name} skipped extra buy`);
    G.extraBuys = 0;
    G.extraBuyFilter = null;
  } else if (G.extraBuyFilter) {
    addLog(`${G.players[G.currentPlayer].name} skipped restricted buy`);
    G.extraBuyFilter = null;
  } else {
    addLog(`${G.players[G.currentPlayer].name} skipped buying`);
  }
  if (G.currentPlayer === 0) { G.phase = 'pass'; renderGame(); } else { endTurn(); }
}

function claimCard(cardId) {
  const state = G.pendingClaim;
  if (!state || !state.queue.length) return;
  const lvl = state.queue[0];
  const cards = G.shipyard['l' + lvl];
  const idx = cards.findIndex(c => c.id === cardId);
  if (idx === -1) return;
  const card = cards[idx];
  const player = G.players[state.pi];
  player.sectors[card.sector].deployed.push({...player.sectors[card.sector].stationed});
  player.sectors[card.sector].stationed = {...card, chargeCount: 0};
  cards.splice(idx, 1);
  const refill = G.shipyard['l' + lvl + 'deck'].shift();
  if (refill) cards.push(refill);
  addLog(player.name + ' claimed ' + card.name + ' (L' + lvl + ', S' + card.sector + ') for free');
  state.queue.shift();
  if (!state.queue.length) { G.phase = state.afterPhase; G.pendingClaim = null; }
  renderGame();
}

function skipClaim() {
  const state = G.pendingClaim;
  if (!state) return;
  const lvl = state.queue.shift();
  addLog(G.players[state.pi].name + ' skipped L' + lvl + ' claim');
  if (!state.queue.length) { G.phase = state.afterPhase; G.pendingClaim = null; }
  renderGame();
}

function passToNextPlayer() {
  endTurn();
}

function endTurn() {
  const p = G.players[G.currentPlayer];
  if (p.credits < p.income) p.credits = p.income;

  if (!G.endTriggered) {
    G.players.forEach(pl => {
      if (pl.vp >= 40 && !G.endTriggered) {
        G.endTriggered = true;
        addLog(`${pl.name} reached 40 VP! Finishing the round...`);
      }
    });
  }

  const rightOfStart = (G.startPlayer - 1 + G.players.length) % G.players.length;
  if (G.endTriggered && G.currentPlayer === rightOfStart) { endGame(); return; }

  G.currentPlayer = (G.currentPlayer + 1) % G.players.length;
  G.phase = 'roll';
  G.dice = [0,0];
  G.chosenDiceMode = null;
  G.pendingArrows = [];
  G.pendingAbility = null;
  G.pendingClaim = null;
  G.extraBuys = 0;
  G.extraBuyFilter = null;
  G.rollBonus = 0;
  G.rollTotal = null;
  if (G.currentPlayer === 0) G.viewingPlayer = 0;
  renderGame();
}

function endGame() {
  show('end-screen');
  const sorted = [...G.players].sort((a,b) => b.vp - a.vp);
  document.getElementById('winner-title').textContent = `${sorted[0].name} wins!`;
  document.getElementById('winner-subtitle').textContent = `${sorted[0].vp} VP — Admiral of the Fleet!`;
  document.getElementById('final-scores').innerHTML = '<h2>Final Scores</h2>' +
    sorted.map((p,i) => `<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:0.5px solid var(--border);">
      <span>${i+1}. ${p.name}</span><span class="badge purple">${p.vp} VP</span></div>`).join('');
}

function buyColony(sector) {
  const cp = G.players[G.currentPlayer];
  const colony = COLONY_CARDS.find(c => c.sector === sector);
  if (!colony || G.phase !== 'buy' || cp.credits < colony.cost || G.colonyPurchased[sector]) return;
  const colonyCard = {
    id: 'colony_s' + sector,
    name: 'Colony · S' + sector,
    type: 'Colony Card',
    sector: sector,
    level: 3,
    isColony: true,
    colonyVp: colony.vp,
    cost: colony.cost,
    station: null,
    deployed: null
  };
  cp.sectors[sector].deployed.push({...cp.sectors[sector].stationed});
  cp.sectors[sector].stationed = colonyCard;
  cp.sectors[sector].colonyLocked = true;
  cp.vp += colony.vp;
  cp.credits = 0;
  G.colonyPurchased[sector] = cp.name;
  addLog(`${cp.name} bought Colony Card S${sector} for ${colony.cost}C — gained ${colony.vp} VP!`);
  if (G.currentPlayer === 0) { G.phase = 'pass'; renderGame(); } else { endTurn(); }
}

function rewardSummary(r) {
  if (!r) return '';
  const p = [];
  if (r.credits) p.push('+' + r.credits + 'C');
  if (r.income)  p.push('+' + r.income + ' Inc');
  if (r.vp)      p.push('+' + r.vp + ' VP');
  if (r.arrow === 'both')  p.push('←→');
  if (r.arrow === 'left')  p.push('←');
  if (r.arrow === 'right') p.push('→');
  if (r.special) p.push(r.special);
  if (r.chargeMax)  p.push('+1 charge');
  else if (r.charge) p.push('+' + r.charge + ' charge token' + (r.charge > 1 ? 's' : ''));
  return p.join(', ');
}

function setCharge(pi, sector, isDeployed, deployedIdx, newCount) {
  const sec = G.players[pi].sectors[sector];
  const card = isDeployed ? sec.deployed[deployedIdx] : sec.stationed;
  const max = isDeployed ? (card.deployed && card.deployed.chargeMax || 0) : (card.station && card.station.chargeMax || 0);
  card.chargeCount = Math.max(0, Math.min(max, newCount));
  renderGame();
}

function parseClaimQueue(special) {
  const queue = [];
  const comboM = special.match(/Claim L(\d+)\s*\+\s*L(\d+)/i);
  if (comboM) { queue.push(parseInt(comboM[1]), parseInt(comboM[2])); return queue; }
  const multiM = special.match(/Claim\s+(\d+)[×x]?\s*L(\d+)/i);
  if (multiM) { const c = parseInt(multiM[1]), l = parseInt(multiM[2]); for (let i=0;i<c;i++) queue.push(l); return queue; }
  const singleM = special.match(/Claim\s+L(\d+)/i);
  if (singleM) { queue.push(parseInt(singleM[1])); return queue; }
  return queue;
}

function autoClaimCard(pi, lvl) {
  const cards = G.shipyard['l' + lvl];
  if (!cards.length) { addLog(G.players[pi].name + ' tried to claim L' + lvl + ' but shipyard is empty'); return; }
  const card = cards[0];
  const player = G.players[pi];
  player.sectors[card.sector].deployed.push({...player.sectors[card.sector].stationed});
  player.sectors[card.sector].stationed = {...card, chargeCount: 0};
  cards.splice(0, 1);
  const refill = G.shipyard['l' + lvl + 'deck'].shift();
  if (refill) cards.push(refill);
  addLog(player.name + ' claimed ' + card.name + ' (L' + lvl + ', S' + card.sector + ') for free');
}

function getAbilityType(special) {
  if (!special) return null;
  if (/\+\d+ next roll/i.test(special)) return 'next-roll-bonus';
  if (/Swap S\d+\+S\d+/i.test(special)) return 'swap';
  if (/Reroll dice/i.test(special)) return 'reroll';
  if (/Add 1 or 2 to die/i.test(special)) return 'add-die-2';
  if (/Add 1 to die/i.test(special)) return 'add-die-1';
  if (/Set 1 die/i.test(special)) return 'set-die';
  if (/Double active/i.test(special)) return 'double-active';
  if (/Double passive/i.test(special)) return 'double-passive';
  if (/Opp.*VP/i.test(special)) return 'opp-vp';
  if (/YOU WIN/i.test(special)) return 'win';
  if (/Roll=charge/i.test(special)) return 'roll-charge';
  if (/20C when charged/i.test(special)) return 'credits-charged';
  if (/^Buy\s+(?:a\s+)?card/i.test(special)) return 'buy-card';
  if (/Claim/i.test(special)) return 'claim';
  if (/Exchange card/i.test(special)) return 'exchange';
  return 'generic';
}

function isGreenAbility(special) {
  const t = getAbilityType(special);
  return t === 'next-roll-bonus' || t === 'add-die-1' || t === 'add-die-2' || t === 'exchange';
}

function isRollBoostAbility(special) {
  const t = getAbilityType(special);
  return t === 'next-roll-bonus' || t === 'add-die-1' || t === 'add-die-2';
}

function humanHasChargedGreenAbility() {
  const human = G.players[0];
  for (let s = 1; s <= 12; s++) {
    const sec = human.sectors[s];
    if (sec.stationed.station && sec.stationed.station.chargeMax && isRollBoostAbility(sec.stationed.station.special || '') &&
        (sec.stationed.chargeCount || 0) >= sec.stationed.station.chargeMax) return true;
    for (let i = 0; i < sec.deployed.length; i++) {
      const d = sec.deployed[i];
      if (d.deployed && d.deployed.chargeMax && isRollBoostAbility(d.deployed.special || '') &&
          (d.chargeCount || 0) >= d.deployed.chargeMax) return true;
    }
  }
  return false;
}

function abilityBoostHasReward(special, currentTotal) {
  const human = G.players[0];
  const type = getAbilityType(special);
  const maxDelta = (type === 'add-die-2') ? 2 : 1;
  const isOwnTurn = G.currentPlayer === 0;
  for (let d = 1; d <= maxDelta; d++) {
    const target = currentTotal + d;
    if (target < 1 || target > 12) continue;
    if (isOwnTurn) return true;
    if (human.sectors[target].deployed.length > 0) return true;
  }
  return false;
}

function shouldOfferGreenBonus() {
  if (!humanHasChargedGreenAbility()) return false;
  const human = G.players[0];
  const base = G.dice[0] + G.dice[1] + (G.rollBonus || 0);
  for (let s = 1; s <= 12; s++) {
    const sec = human.sectors[s];
    if (sec.stationed.station && sec.stationed.station.chargeMax && isRollBoostAbility(sec.stationed.station.special || '') &&
        (sec.stationed.chargeCount || 0) >= sec.stationed.station.chargeMax &&
        abilityBoostHasReward(sec.stationed.station.special, base)) return true;
    for (let i = 0; i < sec.deployed.length; i++) {
      const d = sec.deployed[i];
      if (d.deployed && d.deployed.chargeMax && isRollBoostAbility(d.deployed.special || '') &&
          (d.chargeCount || 0) >= d.deployed.chargeMax &&
          abilityBoostHasReward(d.deployed.special, base)) return true;
    }
  }
  return false;
}

function getValidArrowTargets(pi, sector, arrow, side) {
  const player = G.players[pi];
  const candidates = [];
  if ((arrow === 'left'  || arrow === 'both') && sector > 1)  candidates.push(sector - 1);
  if ((arrow === 'right' || arrow === 'both') && sector < 12) candidates.push(sector + 1);
  if (side === 'deployed') {
    return candidates.filter(function(s) { return player.sectors[s].deployed.length > 0; });
  }
  return candidates;
}

function swapSectors(pi, s1, s2) {
  const p = G.players[pi];
  const tmp = {stationed: p.sectors[s1].stationed, deployed: p.sectors[s1].deployed, colonyLocked: p.sectors[s1].colonyLocked};
  p.sectors[s1] = {stationed: p.sectors[s2].stationed, deployed: p.sectors[s2].deployed, colonyLocked: p.sectors[s2].colonyLocked};
  p.sectors[s2] = tmp;
  addLog(p.name + ' swapped S' + s1 + ' ↔ S' + s2);
}

function activateAbility(pi, sector, isDeployed, deployedIdx) {
  const sec = G.players[pi].sectors[sector];
  const card = isDeployed ? sec.deployed[deployedIdx] : sec.stationed;
  const reward = isDeployed ? card.deployed : card.station;
  if (!reward || !reward.chargeMax || (card.chargeCount || 0) < reward.chargeMax) return;
  const special = reward.special || '';
  const type = getAbilityType(special);
  const prevCount = card.chargeCount || 0;
  card.chargeCount = 0;
  if (type === 'next-roll-bonus') {
    if (G.phase === 'post-roll-bonus') {
      G.rollBonus = (G.rollBonus || 0) + 1;
      addLog(G.players[pi].name + ' green ability: +1 to roll → total now ' + (G.dice[0] + G.dice[1] + G.rollBonus));
      G.phase = shouldOfferGreenBonus() ? 'post-roll-bonus' : 'choose-dice';
    } else {
      G.nextRollBonus = (G.nextRollBonus || 0) + 1;
      addLog(G.players[pi].name + ' pre-armed: +1 to next roll total');
    }
  } else if (type === 'swap') {
    const m = special.match(/Swap S(\d+)\+S(\d+)/i);
    if (m) swapSectors(pi, parseInt(m[1]), parseInt(m[2]));
  } else if (type === 'reroll') {
    G.dice = [Math.ceil(Math.random()*6), Math.ceil(Math.random()*6)];
    const cm = special.match(/\+(\d+)C/);
    if (cm) G.players[pi].credits = Math.min(20, G.players[pi].credits + parseInt(cm[1]));
    addLog(G.players[pi].name + ' rerolled — ' + G.dice[0] + ' + ' + G.dice[1] + ' = ' + (G.dice[0]+G.dice[1]));
    G.phase = 'choose-dice';
  } else if (type === 'add-die-1') {
    if (G.phase === 'post-roll-bonus') {
      G.rollBonus = (G.rollBonus || 0) + 1;
      addLog(G.players[pi].name + ' green ability: +1 to roll → total now ' + (G.dice[0] + G.dice[1] + G.rollBonus));
      G.phase = shouldOfferGreenBonus() ? 'post-roll-bonus' : 'choose-dice';
    } else {
      G.nextRollBonus = (G.nextRollBonus || 0) + 1;
      addLog(G.players[pi].name + ' pre-armed: +1 to next roll total');
    }
  } else if (type === 'add-die-2') {
    if (G.phase === 'post-roll-bonus') {
      G.pendingAbility = {type: 'choose-add-postroll', pi};
    } else {
      G.pendingAbility = {type: 'choose-add', pi};
    }
  } else if (type === 'set-die') {
    // set-die is handled by activateSetDie() in the pre-roll phase only
    card.chargeCount = prevCount; // restore charge — wrong context
    renderGame(); return;
  } else if (type === 'opp-vp') {
    const m = special.match(/(\d+)VP/i);
    const loss = m ? parseInt(m[1]) : 3;
    G.players.forEach(function(op, i) { if (i !== pi) op.vp = Math.max(0, op.vp - loss); });
    addLog(G.players[pi].name + ' ability — all opponents -' + loss + ' VP');
    const buyM = special.match(/buy\s+(\d+)(?:-(\d+))?\s+cards?/i);
    if (buyM) {
      const minBuy = parseInt(buyM[1]);
      const maxBuy = buyM[2] ? parseInt(buyM[2]) : minBuy;
      if (pi === 0) {
        if (maxBuy > minBuy) {
          G.pendingAbility = {type: 'choose-buy-count', pi, minBuy, maxBuy};
        } else {
          G.extraBuys = (G.extraBuys || 0) + minBuy;
          addLog(G.players[pi].name + ' +' + minBuy + ' extra buy(s) this turn');
        }
      }
    }
  } else if (type === 'win') {
    addLog(G.players[pi].name + ' used YOU WIN — game over!');
    endGame(); return;
  } else if (type === 'roll-charge') {
    const earned = prevCount * 3;
    G.players[pi].credits = Math.min(20, G.players[pi].credits + earned);
    addLog(G.players[pi].name + ' Roll=Charge: ' + prevCount + ' charges → +' + earned + 'C');
  } else if (type === 'credits-charged') {
    G.players[pi].credits = Math.min(20, G.players[pi].credits + 20);
    addLog(G.players[pi].name + ' ability — +20C when charged');
  } else if (type === 'claim') {
    const queue = parseClaimQueue(special);
    if (pi === 0) {
      G.pendingClaim = {queue, pi, afterPhase: G.phase};
      G.phase = 'claim';
    } else {
      queue.forEach(function(lvl) { autoClaimCard(pi, lvl); });
    }
  } else if (type === 'exchange') {
    if (pi === 0) {
      G.pendingAbility = {type: 'exchange', pi, sector, isDeployed, deployedIdx};
    }
  } else if (type === 'buy-card') {
    if (G.phase !== 'buy') {
      card.chargeCount = prevCount;
      addLog(G.players[pi].name + ': buy-card ability can only be used during the buy phase');
      renderGame(); return;
    }
    const restrictM = special.match(/S(\d+)-(\d+)/i);
    G.extraBuys = (G.extraBuys || 0) + 1;
    G.extraBuyFilter = restrictM ? {min: parseInt(restrictM[1]), max: parseInt(restrictM[2])} : null;
    addLog(G.players[pi].name + ' ability — +1 extra buy this turn' + (G.extraBuyFilter ? ' (S' + G.extraBuyFilter.min + '-' + G.extraBuyFilter.max + ' only)' : '') + '!');
  } else {
    addLog(G.players[pi].name + ' used: ' + special);
  }
  renderGame();
}

function confirmBuyCount(n) {
  const pa = G.pendingAbility;
  if (!pa || pa.type !== 'choose-buy-count') return;
  G.extraBuys = (G.extraBuys || 0) + n;
  G.pendingAbility = null;
  addLog(G.players[pa.pi].name + ' chose ' + n + ' extra buy' + (n > 1 ? 's' : '') + ' this turn');
  renderGame();
}

function confirmAddBonus(delta) {
  if (G.pendingAbility.type === 'choose-add-postroll') {
    G.rollBonus = (G.rollBonus || 0) + delta;
    addLog(G.players[G.pendingAbility.pi].name + ' green ability: +' + delta + ' to roll → total now ' + (G.dice[0] + G.dice[1] + G.rollBonus));
    G.pendingAbility = null;
    G.phase = shouldOfferGreenBonus() ? 'post-roll-bonus' : 'choose-dice';
  } else {
    G.nextRollBonus = (G.nextRollBonus || 0) + delta;
    addLog(G.players[G.pendingAbility.pi].name + ' pre-armed: +' + delta + ' to next roll total');
    G.pendingAbility = null;
  }
  renderGame();
}

function skipGreenBonus() {
  G.phase = 'choose-dice';
  renderGame();
}

function confirmSetTotal(val) {
  if (G.pendingAbility && G.pendingAbility.bonus) {
    G.players[G.pendingAbility.pi].credits = Math.min(20, G.players[G.pendingAbility.pi].credits + G.pendingAbility.bonus);
  }
  G.nextRollTotal = val;
  addLog(G.players[G.pendingAbility.pi].name + ' pre-armed: next roll total → ' + val);
  G.pendingAbility = null;
  renderGame();
}

function cancelAbility() {
  G.pendingAbility = null;
  renderGame();
}

function confirmExchange(targetSector, targetIsDeployed, targetDeployedIdx) {
  const pa = G.pendingAbility;
  if (!pa || pa.type !== 'exchange') return;
  const player = G.players[pa.pi];
  const zSlot = player.sectors[pa.sector];
  const tSlot = player.sectors[targetSector];
  const zCard = pa.isDeployed ? zSlot.deployed[pa.deployedIdx] : zSlot.stationed;
  const tCard = targetIsDeployed ? tSlot.deployed[targetDeployedIdx] : tSlot.stationed;
  if (pa.isDeployed) zSlot.deployed[pa.deployedIdx] = tCard;
  else zSlot.stationed = tCard;
  if (targetIsDeployed) tSlot.deployed[targetDeployedIdx] = zCard;
  else tSlot.stationed = zCard;
  addLog(player.name + ' exchanged ' + zCard.name + ' (S' + pa.sector + (pa.isDeployed ? ' passive' : ' active') + ') ↔ ' + tCard.name + ' (S' + targetSector + (targetIsDeployed ? ' passive' : ' active') + ')');
  G.pendingAbility = null;
  renderGame();
}

function activateSetDie(pi, sector, isDeployed, deployedIdx) {
  if (G.phase !== 'roll' || pi !== 0) return;
  const sec = G.players[pi].sectors[sector];
  const card = isDeployed ? sec.deployed[deployedIdx] : sec.stationed;
  const reward = isDeployed ? card.deployed : card.station;
  if (!reward || !reward.chargeMax || (card.chargeCount || 0) < 1) return;
  const chargeCount = card.chargeCount || 0;
  const diceToSet = Math.min(chargeCount, 2);
  const m = (reward.special || '').match(/\+(\d+)C\/die/i);
  const creditPerDie = m ? parseInt(m[1]) : 0;
  const originalCharge = chargeCount;
  card.chargeCount = 0;
  G.setDice = [null, null];
  G.pendingAbility = {type: 'set-die-pre', pi, sector, isDeployed, deployedIdx, originalCharge, diceLeft: diceToSet, creditPerDie};
  addLog(G.players[pi].name + ' set-die: will pre-set ' + diceToSet + ' die' + (diceToSet > 1 ? 's' : ''));
  renderGame();
}

function confirmSetDie(value) {
  const pa = G.pendingAbility;
  if (!pa || pa.type !== 'set-die-pre') return;
  if (!G.setDice) G.setDice = [null, null];
  if (G.setDice[0] === null) {
    G.setDice[0] = value;
  } else {
    G.setDice[1] = value;
  }
  if (pa.creditPerDie > 0) {
    G.players[pa.pi].credits = Math.min(20, G.players[pa.pi].credits + pa.creditPerDie);
  }
  pa.diceLeft--;
  if (pa.diceLeft <= 0) G.pendingAbility = null;
  renderGame();
}

function cancelSetDie() {
  const pa = G.pendingAbility;
  if (!pa || pa.type !== 'set-die-pre') return;
  const sec = G.players[pa.pi].sectors[pa.sector];
  const card = pa.isDeployed ? sec.deployed[pa.deployedIdx] : sec.stationed;
  card.chargeCount = pa.originalCharge;
  G.setDice = null;
  G.pendingAbility = null;
  renderGame();
}

function resolveArrow(pi, fromSector, toSector) {
  const player = G.players[pi];
  const arrow = G.pendingArrows[0];
  if (arrow.side === 'station') {
    const r = player.sectors[toSector].stationed.station;
    applyReward(player, r);
    addLog(player.name + ' arrow S' + fromSector + '→S' + toSector + ': ' + (rewardSummary(r) || '—'));
    if (r && r.arrow) {
      const vt = getValidArrowTargets(pi, toSector, r.arrow, 'station');
      if (vt.length > 0) G.pendingArrows.splice(1, 0, {pi, sector: toSector, arrow: r.arrow, side: 'station'});
    }
  } else {
    const gains = [];
    let chainArrow = null;
    player.sectors[toSector].deployed.forEach(function(d) {
      applyReward(player, d.deployed);
      const s = rewardSummary(d.deployed); if (s) gains.push(s);
      if (d.deployed && d.deployed.arrow && !chainArrow) {
        const vt = getValidArrowTargets(pi, toSector, d.deployed.arrow, 'deployed');
        if (vt.length > 0) chainArrow = {pi, sector: toSector, arrow: d.deployed.arrow, side: 'deployed'};
      }
    });
    addLog(player.name + ' arrow S' + fromSector + '→S' + toSector + ': ' + (gains.join(', ') || '—'));
    if (chainArrow) G.pendingArrows.splice(1, 0, chainArrow);
  }
  G.pendingArrows.shift();
  if (!G.pendingArrows.length) G.phase = 'buy';
  renderGame();
}

function skipArrow(pi, sector) {
  addLog(G.players[pi].name + ' skipped arrow from S' + sector);
  G.pendingArrows.shift();
  if (!G.pendingArrows.length) G.phase = 'buy';
  renderGame();
}

function addLog(msg) { G.log.unshift(msg); if (G.log.length > 20) G.log.pop(); }
function resetGame() { if (aiTimer) { clearTimeout(aiTimer); aiTimer = null; } show('setup-screen'); initSetup(); }

// ─── AI ──────────────────────────────────────────────────────────────────────
let aiTimer = null;

function scheduleAiAction() {
  if (!G.players || G.currentPlayer === 0) return;
  if (G.phase === 'passive-choice') return;
  if (aiTimer) clearTimeout(aiTimer);
  if (G.phase === 'roll') {
    aiTimer = setTimeout(function() { aiTimer = null; rollDice(); }, 900);
  } else if (G.phase === 'choose-dice') {
    aiTimer = setTimeout(function() { aiTimer = null; aiChooseDice(); }, 700);
  } else if (G.phase === 'arrow-choice' && G.pendingArrows.length && G.pendingArrows[0].pi !== 0) {
    aiTimer = setTimeout(function() { aiTimer = null; aiResolveArrow(); }, 700);
  } else if (G.phase === 'buy') {
    aiTimer = setTimeout(function() { aiTimer = null; aiDoBuy(); }, 700);
  }
}

function aiChooseDice() {
  if (G.currentPlayer === 0) return;
  const [d1, d2] = G.dice;
  chooseDiceMode(d1 === d2 ? 'split' : 'total');
}

function aiResolveArrow() {
  if (!G.pendingArrows.length || G.pendingArrows[0].pi === 0) return;
  const arr = G.pendingArrows[0];
  const validTargets = getValidArrowTargets(arr.pi, arr.sector, arr.arrow, arr.side);
  if (validTargets.length > 0) resolveArrow(arr.pi, arr.sector, validTargets[0]);
  else skipArrow(arr.pi, arr.sector);
}

function aiDoBuy() {
  if (G.currentPlayer === 0) return;
  const cp = G.players[G.currentPlayer];
  const aiFilter = (G.extraBuys || 0) === 0 && G.extraBuyFilter;
  let bestCard = null;
  for (const l of [3, 2, 1]) {
    const affordable = G.shipyard['l' + l].filter(function(c) {
      return cp.credits >= c.cost && (!aiFilter || (c.sector >= aiFilter.min && c.sector <= aiFilter.max));
    });
    if (affordable.length) {
      bestCard = affordable.reduce(function(a, b) { return b.cost > a.cost ? b : a; });
      break;
    }
  }
  if (bestCard) buyCard(bestCard.id);
  else skipBuy();
}
function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// ─── RENDER ──────────────────────────────────────────────────────────────────
function renderGame() { renderTabs(); renderBanner(); renderMain(); scheduleAiAction(); }

function shiftViewer(dir) {
  G.viewingPlayer = (G.viewingPlayer + dir + G.players.length) % G.players.length;
  renderGame();
}

function renderTabs() {
  const vp = G.players[G.viewingPlayer];
  const isActive = G.viewingPlayer === G.currentPlayer;
  const isHumanTurn = G.currentPlayer === 0;
  const label = document.getElementById('viewer-label');
  if (label) {
    let badge = '';
    if (isActive && isHumanTurn) {
      badge = ' <span style="font-size:10px;background:var(--blue);color:#fff;border-radius:10px;padding:1px 6px;vertical-align:middle;">Your turn</span>';
    } else if (isActive && !isHumanTurn) {
      badge = ' <span style="font-size:10px;background:var(--gold);color:#fff;border-radius:10px;padding:1px 6px;vertical-align:middle;">CPU turn</span>';
    }
    label.innerHTML = vp.name + badge;
  }
}

  const p = G.players[G.currentPlayer];

  const labels = {roll:'Roll dice','choose-dice':'Allocate dice','passive-choice':'Passive rewards',buy:'Buy a ship','arrow-choice':'Arrow reward','post-roll-bonus':'Green Ability',pass:'Turn done'};

  document.getElementById('active-player-banner').innerHTML =
    `<div><div style="font-size:11px;color:var(--text2);">${isHumanTurn ? 'Your turn' : 'CPU opponent'}</div>
     <div style="font-size:15px;font-weight:600;">${p.name}</div></div>

    + '</div>';
  html += '<div style="background:var(--surface2);border-radius:8px;padding:7px 4px;text-align:center;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;">'
    + '<svg width="20" height="20" viewBox="0 0 32 32"><path d="M16 2 C16 2 24 8 24 18 L20 22 L12 22 L8 18 C8 8 16 2 16 2Z" fill="#7F77DD"/><circle cx="16" cy="17" r="4" fill="#534AB7"/><circle cx="16" cy="17" r="2" fill="#EEEDFE"/><path d="M8 18 L4 25 L11 22Z" fill="#534AB7" opacity="0.8"/><path d="M24 18 L28 25 L21 22Z" fill="#534AB7" opacity="0.8"/><path d="M12 22 L13 30 L16 26 L19 30 L20 22Z" fill="#7F77DD" opacity="0.9"/></svg>'
    + '<div style="font-size:15px;font-weight:700;color:var(--purple);line-height:1.1;">' + vp.vp + '<span style="font-size:8px;font-weight:400;color:var(--text2);">/40</span></div>'
    + '<div style="font-size:8px;color:var(--text2);text-transform:uppercase;letter-spacing:0.3px;">VP</div>'
    + '</div>';
  html += '</div>';

  // Right 3/4: scrollable sector row
  html += '<div class="sectors-container" style="flex:1;overflow:hidden;">';
  html += '<div class="sectors-grid" style="justify-content:center;">';
  for (let s=1; s<=12; s++) {
    const sec = vp.sectors[s];
    const hlType = sectorHL[s] || null;
    const isHL = hlType === 'blue';
    const stationed = sec.stationed;
    // Art bg: level 0=starting(dark navy), 1=blue, 2=green, 3=purple
    const artBgs = [
      'linear-gradient(160deg,#0a1020 0%,#0d1830 100%)',
      'linear-gradient(160deg,#0a1628 0%,#1a2a5c 50%,#0d1f3c 100%)',
      'linear-gradient(160deg,#0d1a0d 0%,#1a3d1a 50%,#0a1a0a 100%)',
      'linear-gradient(160deg,#1a0a28 0%,#3d1a5c 50%,#1a0d3c 100%)'
    ];
    const nameBgs = ['#080e1a','#0a1a3a','#0a1a0a','#1a0a2d'];
    const lvl = stationed.level || 0;
    const artBg = stationed.isColony ? 'linear-gradient(160deg,#1a0a28 0%,#2d1040 50%,#0d0818 100%)' : artBgs[Math.min(lvl,3)];
    const nameBg = nameBgs[Math.min(lvl,3)];
    const isGreenSta = stationed.station && isGreenAbility(stationed.station.special || '');
    const isChargedGreenSta = isGreenSta && (stationed.chargeCount || 0) >= (stationed.station.chargeMax || 1);
    const stationRowBg = stationed.isColony ? '#2d1a4a' : isGreenSta ? (isChargedGreenSta ? 'rgba(74,158,106,0.4)' : '#1a3a1a') : '#1a3a5c';
    const stationContent = stationed.isColony
      ? rewardIcons({vp: stationed.colonyVp}, boardActiveIconSize({vp: stationed.colonyVp}))
      : rewardIcons(stationed.station, boardActiveIconSize(stationed.station), stationed.chargeCount || 0);
    let wrapperBorderStyle = '';
    if (hlType === 'yellow') {
      wrapperBorderStyle = 'border:1.5px solid rgba(240,192,64,0.9);box-shadow:0 0 8px rgba(240,192,64,0.3);';
    } else if (hlType === 'green') {
      wrapperBorderStyle = 'border:1.5px solid rgba(80,210,120,0.9);box-shadow:0 0 8px rgba(80,210,120,0.3);';
    } else if (isChargedGreenSta && !isHL) {
      wrapperBorderStyle = 'border:2px solid var(--green);box-shadow:0 0 12px rgba(74,158,106,0.4);';
    }
    // Passive rows sit above the art, content rotated 180° so they read normally when card is flipped
    const passiveRows = sec.deployed.map(function(d) {
      const isGreenDep = d.deployed && isGreenAbility(d.deployed.special || '');
      const isChargedGreenDep = isGreenDep && (d.chargeCount || 0) >= (d.deployed.chargeMax || 1);
      const depRowBg = isGreenDep ? (isChargedGreenDep ? 'rgba(74,158,106,0.4)' : '#1a3a1a') : '#5c1a1a';
      return '<div class="sec-passive-row" style="background:' + depRowBg + ';border-top:none;border-bottom:1px solid rgba(255,255,255,0.08);">'
        + rewardIcons(d.deployed, boardPassiveIconSize(d.deployed), d.chargeCount || 0)
        + '</div>';
    }).join('');
    html += '<div class="sector-wrapper ' + (isHL ? 'highlighted' : '') + '" style="' + wrapperBorderStyle + '">'
      + passiveRows
      + '<div class="sector">'
      + '<div class="sec-art" style="background:' + artBg + ';">'
      + '<div class="sec-stars"></div>'
      + (stationed.cost ? '<div class="sec-cost">' + stationed.cost + '</div>' : '')
      + '<div class="sec-num">' + s + '</div>'
      + '<div class="sec-ship-icon">' + (stationed.isColony ? '🌍' : '🚀') + '</div>'
      + '<div class="sec-namebar" style="background:' + nameBg + ';">'
      + '<div class="sec-name">' + (stationed.isColony ? 'Colony Card' : stationed.name) + '</div>'
      + '<div class="sec-type">' + (stationed.isColony ? 'S' + s + ' · Locked' : (stationed.type||'Starting Card')) + '</div>'
      + '</div>'
      + '</div>'
      + '<div class="sec-station" style="background:' + stationRowBg + ';">' + stationContent + '</div>'
      + (stationed.deployed ? '<div class="sec-passive-row" style="background:' + (isGreenAbility(stationed.deployed.special || '') ? '#1a3a1a' : '#5c1a1a') + ';border-top:1px solid rgba(255,255,255,0.08);">'
        + '<div style="transform:rotate(180deg);display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:4px;width:100%;">'
        + rewardIcons(stationed.deployed, boardPassiveIconSize(stationed.deployed)) + '</div></div>' : '')
      + '</div>'
      + '</div>';
  }
  html += '</div></div>';
  html += '</div></div>';

  // Activity feed at the very bottom
  if (G.log.length) {
    html += '<div class="log" style="margin-top:8px;">' + G.log.slice(0,6).map(function(l){ return '<div class="log-entry">' + l + '</div>'; }).join('') + '</div>';
  }

  document.getElementById('main-content').innerHTML = html;
}

// ─── AUDIO ───────────────────────────────────────────────────────────────────
const bgAudio = new Audio('./3.mp3');
bgAudio.loop = true;
bgAudio.volume = 0.4;
let musicPlaying = false;

function toggleMusic() {
  const btn = document.getElementById('music-btn');
  if (musicPlaying) {
    bgAudio.pause();
    musicPlaying = false;
    if (btn) btn.textContent = '🔇';
  } else {
    bgAudio.currentTime = bgAudio.currentTime || 0;
    const playPromise = bgAudio.play();
    if (playPromise !== undefined) {
      playPromise.then(() => {
        musicPlaying = true;
        if (btn) btn.textContent = '🔊';
      }).catch((e) => {
        // Try resuming AudioContext if suspended
        if (window.AudioContext || window.webkitAudioContext) {
          const ac = new (window.AudioContext || window.webkitAudioContext)();
          ac.resume().then(() => {
            bgAudio.play().then(() => {
              musicPlaying = true;
              if (btn) btn.textContent = '🔊';
            }).catch(() => {});
          });
        }
      });
    }
  }
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
initSetup();

// Register service worker for offline support
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}

// ─── DYNAMIC MOBILE ZOOM ─────────────────────────────────────────────────────
function setMobileZoom() {
  const mz = document.getElementById('mz');
  if (!mz) return;
  const portrait  = window.matchMedia('(orientation: portrait) and (max-width: 600px)').matches;
  const landscape = window.matchMedia('(orientation: landscape) and (max-height: 500px)').matches;
  if (portrait) {
    // avail = screen width minus arrow padding (44×2) and card padding (12×2)
    const avail = window.innerWidth - 112;
    // floor the cell width so 6 cells + 5×3px gaps always fit without overflow
    const cellW = Math.floor((avail - 15) / 6);
    const sz = (cellW / 175).toFixed(4);
    mz.textContent = `
      @media (orientation: portrait) and (max-width: 600px) {
        .sector-wrapper { zoom: ${sz} !important; }
      }`;
  } else if (landscape) {
    // avail = screen width minus arrow padding, card padding, and stats panel (68+8)
    const avail = window.innerWidth - 188;
    // floor the cell width so 12 cells + 11×3px gaps always fit without overflow
    const cellW = Math.floor((avail - 33) / 12);
    const sz = (cellW / 175).toFixed(4);
    mz.textContent = `
      @media (orientation: landscape) and (max-height: 500px) {
        .sector-wrapper { zoom: ${sz} !important; }
      }`;
  } else {
    mz.textContent = '';
  }
}
window.addEventListener('DOMContentLoaded', setMobileZoom);
window.addEventListener('resize', setMobileZoom);
window.addEventListener('orientationchange', () => setTimeout(setMobileZoom, 150));
</script>
